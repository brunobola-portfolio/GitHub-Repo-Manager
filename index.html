<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GitHub Repo Manager — repos, AI review and migration</title>
    <meta name="description" content="Manage GitHub repositories from one dashboard: cross-repo Work Board with DORA metrics, AI pull-request review and Azure DevOps migration. Apache-2.0." />
    <!-- __PUBLIC_ORIGIN__ is filled per deployment by server/lib/spa-shell.js
         (and by vite.config.js in dev), so a self-hosted install advertises
         its own origin, never this project's. -->
    <link rel="canonical" href="__PUBLIC_ORIGIN__/" />
    <meta property="og:site_name" content="GitHub Repo Manager" />
    <meta property="og:title" content="GitHub Repo Manager — repos, AI review and migration" />
    <meta property="og:description" content="Cross-repo Work Board with DORA metrics, AI Deep Review and Azure DevOps migration. Bring your own AI key. Open source, native on Windows." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__PUBLIC_ORIGIN__/" />
    <meta property="og:image" content="__PUBLIC_ORIGIN__/og-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The RepoManager mark beside the wordmark on a dark ground, with the line: the repository that needs you." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GitHub Repo Manager — repos, AI review and migration" />
    <meta name="twitter:description" content="Cross-repo Work Board with DORA metrics, AI Deep Review and Azure DevOps migration. Bring your own AI key. Open source, native on Windows." />
    <meta name="twitter:image" content="__PUBLIC_ORIGIN__/og-1200x630.png" />
    <meta name="twitter:image:alt" content="The RepoManager mark beside the wordmark on a dark ground, with the line: the repository that needs you." />
    <!-- Self-hosted display typeface (Mona Sans, OFL). No external font CDN,
         so the app stays private + offline-capable. Preloaded to avoid a
         flash on headings. -->
    <link rel="preload" href="/fonts/mona-sans.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- Applies dark mode BEFORE React renders. External, not inline: the
         production CSP is `script-src 'self'` (server/index.js), which blocks
         inline scripts outright. See public/theme-init.js. -->
    <script src="/theme-init.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
