<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GitHub Repo Manager — AI-Powered Repository Management</title>
    <meta name="description" content="The open-source platform for intelligent GitHub repository management. AI insights, semantic search, migration tools, and team collaboration." />
    <meta property="og:title" content="GitHub Repo Manager" />
    <meta property="og:description" content="Manage your GitHub repos with AI superpowers. Open source, self-hostable." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/brunobola-portfolio/GitHub-Repo-Manager" />
    <meta property="og:image" content="https://raw.githubusercontent.com/brunobola-portfolio/GitHub-Repo-Manager/main/brand/og-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RepoManager — the RepoManager mark on a dark ground above the wordmark and the line 'The repository that needs you.'" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GitHub Repo Manager" />
    <meta name="twitter:description" content="AI-powered repository management. Open source." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/brunobola-portfolio/GitHub-Repo-Manager/main/brand/og-1200x630.png" />
    <!-- Self-hosted display typeface (Mona Sans, OFL). No external font CDN,
         so the app stays private + offline-capable. Preloaded to avoid a
         flash on headings. -->
    <link rel="preload" href="/fonts/mona-sans.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- Applies dark mode BEFORE React renders. External, not inline: the
         production CSP is `script-src 'self'` (server/index.js), which blocks
         inline scripts outright. See public/theme-init.js. -->
    <script src="/theme-init.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
