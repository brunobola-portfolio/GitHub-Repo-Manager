<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GitHub Repo Manager — AI-Powered Repository Management</title>
    <meta name="description" content="The open-source platform for intelligent GitHub repository management. AI insights, semantic search, migration tools, and team collaboration." />
    <meta property="og:title" content="GitHub Repo Manager" />
    <meta property="og:description" content="Manage your GitHub repos with AI superpowers. Open source, self-hostable." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/brunobola-portfolio/GitHub-Repo-Manager" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GitHub Repo Manager" />
    <meta name="twitter:description" content="AI-powered repository management. Open source." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Apply dark mode BEFORE React renders to prevent flash of light mode
      (function() {
        var saved = localStorage.getItem('github-repo-manager-theme');
        var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
