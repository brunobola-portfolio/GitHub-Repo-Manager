<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="12" fill="url(#bgGrad)"/>

  <!-- ===== FRONTEND TIER ===== -->
  <rect x="30" y="20" width="840" height="150" rx="10" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5"/>
  <rect x="30" y="20" width="840" height="150" rx="10" fill="#1d4ed8" opacity="0.08"/>

  <!-- Frontend label -->
  <rect x="42" y="28" width="210" height="26" rx="13" fill="url(#blueGrad)" filter="shadow"/>
  <text x="147" y="46" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">FRONTEND  ·  React 19 + Vite 7</text>

  <!-- Frontend cards -->
  <rect x="60" y="70" width="230" height="80" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="shadow"/>
  <text x="175" y="95" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">Components</text>
  <text x="175" y="115" text-anchor="middle" fill="#94a3b8" font-size="11">Dashboard · RepoList · Wizard</text>
  <text x="175" y="132" text-anchor="middle" fill="#94a3b8" font-size="11">AI Chat · RepoDetail · Teams</text>

  <rect x="335" y="70" width="230" height="80" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="shadow"/>
  <text x="450" y="95" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">React Hooks</text>
  <text x="450" y="115" text-anchor="middle" fill="#94a3b8" font-size="11">useGitHub · useTheme</text>
  <text x="450" y="132" text-anchor="middle" fill="#94a3b8" font-size="11">useRepoDetail · useKeyboardShortcuts</text>

  <rect x="610" y="70" width="230" height="80" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="shadow"/>
  <text x="725" y="95" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">API Layer</text>
  <text x="725" y="115" text-anchor="middle" fill="#94a3b8" font-size="11">Mock / Real mode switch</text>
  <text x="725" y="132" text-anchor="middle" fill="#94a3b8" font-size="11">Error handling · Retry logic</text>

  <!-- Arrow: Frontend → Backend -->
  <line x1="450" y1="170" x2="450" y2="205" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <rect x="380" y="178" width="140" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="193" text-anchor="middle" fill="#94a3b8" font-size="10">Vite Proxy · API calls</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- ===== BACKEND TIER ===== -->
  <rect x="30" y="210" width="840" height="240" rx="10" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5"/>
  <rect x="30" y="210" width="840" height="240" rx="10" fill="#047857" opacity="0.06"/>

  <!-- Backend label -->
  <rect x="42" y="218" width="240" height="26" rx="13" fill="url(#greenGrad)" filter="shadow"/>
  <text x="162" y="236" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">BACKEND  ·  Express 5 + Node 20</text>

  <!-- Security bar -->
  <rect x="60" y="256" width="780" height="36" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="shadow"/>
  <text x="80" y="279" fill="#fbbf24" font-size="12" font-weight="600">Security</text>
  <text x="145" y="279" fill="#94a3b8" font-size="11">Helmet  ·  Rate Limiting  ·  Zod Validation  ·  SSRF Protection  ·  CSRF  ·  Parameterized SQL</text>

  <!-- Backend cards row -->
  <rect x="60" y="306" width="180" height="70" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="shadow"/>
  <text x="150" y="330" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">API Routes</text>
  <text x="150" y="350" text-anchor="middle" fill="#94a3b8" font-size="11">156+ endpoints</text>
  <text x="150" y="364" text-anchor="middle" fill="#94a3b8" font-size="10">Auth · Repos · Teams · Orgs</text>

  <rect x="260" y="306" width="180" height="70" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="shadow"/>
  <text x="350" y="330" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">AI Service</text>
  <text x="350" y="350" text-anchor="middle" fill="#94a3b8" font-size="11">Gemini 2.5 Flash</text>
  <text x="350" y="364" text-anchor="middle" fill="#94a3b8" font-size="10">Embeddings · Fallbacks</text>

  <rect x="460" y="306" width="180" height="70" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="shadow"/>
  <text x="550" y="330" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">Migration Engine</text>
  <text x="550" y="350" text-anchor="middle" fill="#94a3b8" font-size="11">Planner · Import · Git Ops</text>
  <text x="550" y="364" text-anchor="middle" fill="#94a3b8" font-size="10">Scheduler · Pause/Resume</text>

  <rect x="660" y="306" width="180" height="70" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="shadow"/>
  <text x="750" y="330" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">Database</text>
  <text x="750" y="350" text-anchor="middle" fill="#94a3b8" font-size="11">SQLite WAL + Redis</text>
  <text x="750" y="364" text-anchor="middle" fill="#94a3b8" font-size="10">Sessions · Cache · Jobs</text>

  <!-- GitHub Client bar -->
  <rect x="60" y="390" width="780" height="36" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="shadow"/>
  <text x="80" y="413" fill="#6ee7b7" font-size="12" font-weight="600">GitHub Client</text>
  <text x="170" y="413" fill="#94a3b8" font-size="11">ETag Conditional Requests  ·  Rate Limit Tracking  ·  Batched Fetching  ·  Auto-wait</text>

  <!-- Arrows: Backend → External -->
  <line x1="350" y1="450" x2="200" y2="490" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7" marker-end="url(#arrowPurple)"/>
  <line x1="450" y1="450" x2="450" y2="490" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7" marker-end="url(#arrowPurple)"/>
  <line x1="550" y1="450" x2="700" y2="490" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7" marker-end="url(#arrowPurple)"/>

  <!-- ===== EXTERNAL SERVICES TIER ===== -->
  <rect x="30" y="470" width="840" height="130" rx="10" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5"/>
  <rect x="30" y="470" width="840" height="130" rx="10" fill="#6d28d9" opacity="0.06"/>

  <!-- External label -->
  <rect x="42" y="478" width="170" height="26" rx="13" fill="url(#purpleGrad)" filter="shadow"/>
  <text x="127" y="496" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">EXTERNAL SERVICES</text>

  <!-- External cards -->
  <rect x="60" y="518" width="230" height="65" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="shadow"/>
  <text x="175" y="543" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">Google Gemini AI</text>
  <text x="175" y="563" text-anchor="middle" fill="#94a3b8" font-size="11">Analysis · Search · Generation</text>

  <rect x="335" y="518" width="230" height="65" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="shadow"/>
  <text x="450" y="543" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">Azure DevOps API v7.1</text>
  <text x="450" y="563" text-anchor="middle" fill="#94a3b8" font-size="11">Git · TFVC · Boards · Wikis</text>

  <rect x="610" y="518" width="230" height="65" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="shadow"/>
  <text x="725" y="543" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">GitHub REST API</text>
  <text x="725" y="563" text-anchor="middle" fill="#94a3b8" font-size="11">v2022-11-28 · OAuth 2.0</text>
</svg>
