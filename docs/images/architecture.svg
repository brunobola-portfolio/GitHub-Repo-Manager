<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-label="System architecture: React 19 SPA served by Vite 8 on port 5173 proxies /api to an Express 5 API on port 3001, backed by better-sqlite3 in WAL mode, the GitHub REST API, the Azure DevOps API v7.1 and Stripe billing, with a bring-your-own-key AI layer (Anthropic, OpenAI, Gemini, OpenRouter, LMStudio) routed through guardedGenerate. The database is SQLite only and PostgreSQL is unsupported; Redis is optional, enabled by REDIS_URL, and backs distributed sessions, rate limiting and the job queue.">
  <style>
    svg{--bg:#ffffff;--bg2:#f6f8fa;--card:#ffffff;--stroke:#d0d7de;--text:#1f2328;--muted:#57606a;--blue:#2563eb;--violet:#7c3aed;--emerald:#059669;--amber:#b45309;--red:#cf222e}
    @media (prefers-color-scheme: dark){svg{--bg:#0d1117;--bg2:#161b22;--card:#1c2128;--stroke:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#4f8cff;--violet:#a78bfa;--emerald:#10b981;--amber:#e3b341;--red:#f85149}}
    .bg{fill:var(--bg)}.panel{fill:var(--bg2);stroke:var(--stroke);stroke-width:1}
    .card{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
    .t{fill:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
    .m{fill:var(--muted);font-family:'Segoe UI',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    .b{fill:var(--blue)}.v{fill:var(--violet)}.e{fill:var(--emerald)}.a{fill:var(--amber)}
    .edge{stroke:var(--muted);stroke-width:1.5;fill:none}
    .badge-v{fill:var(--violet);fill-opacity:.13;stroke:var(--violet);stroke-width:1}
    .badge-e{fill:var(--emerald);fill-opacity:.13;stroke:var(--emerald);stroke-width:1}
    .ah{fill:var(--muted)}
  </style>
  <defs>
    <filter id="sh" x="-20%" y="-25%" width="140%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.12"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="620" rx="14"/>
  <text class="t" x="32" y="44" font-size="19" font-weight="700">System Architecture</text>
  <text class="m" x="32" y="66" font-size="12.5">React 19 SPA · Express 5 API · SQLite-only · AI is bring-your-own-key (BYOK)</text>

  <!-- Browser -->
  <rect class="card" x="290" y="88" width="340" height="60" rx="10" filter="url(#sh)"/>
  <text class="t" x="460" y="114" text-anchor="middle" font-size="15" font-weight="700">Browser · React 19 SPA</text>
  <text class="m" x="460" y="134" text-anchor="middle" font-size="11.5">Vite 8 dev server · :5173 · Tailwind v4 · Framer Motion</text>
  <line class="edge" x1="460" y1="148" x2="460" y2="176" marker-end="url(#ah)"/>

  <!-- Vite proxy -->
  <rect class="card" x="320" y="178" width="280" height="48" rx="10" filter="url(#sh)"/>
  <text class="t" x="460" y="200" text-anchor="middle" font-size="13.5" font-weight="700">Vite dev proxy</text>
  <text class="m mono" x="460" y="216" text-anchor="middle" font-size="11">/api  &#8594;  localhost:3001</text>
  <line class="edge" x1="460" y1="226" x2="460" y2="252" marker-end="url(#ah)"/>

  <!-- Express API -->
  <rect class="card" x="270" y="254" width="380" height="84" rx="10" filter="url(#sh)"/>
  <text class="t" x="460" y="282" text-anchor="middle" font-size="15.5" font-weight="700">Express 5 API · :3001</text>
  <text class="b" x="460" y="304" text-anchor="middle" font-size="12" font-weight="600">341 handlers · 77 route modules</text>
  <text class="m" x="460" y="323" text-anchor="middle" font-size="11">Helmet · Zod validation · rate-limit · session cookies (httpOnly)</text>

  <!-- AI BYOK side box -->
  <line class="edge" x1="650" y1="296" x2="678" y2="300" marker-end="url(#ah)"/>
  <rect class="card" x="680" y="250" width="210" height="112" rx="10" filter="url(#sh)"/>
  <rect class="badge-v" x="733" y="262" width="104" height="22" rx="11"/>
  <text class="v" x="785" y="277" text-anchor="middle" font-size="11.5" font-weight="700">AI (BYOK)</text>
  <text class="m" x="785" y="303" text-anchor="middle" font-size="10.8">via guardedGenerate · metered</text>
  <text class="t" x="785" y="322" text-anchor="middle" font-size="10.5">Anthropic · OpenAI · Gemini</text>
  <text class="t" x="785" y="338" text-anchor="middle" font-size="10.5">OpenRouter · LMStudio</text>
  <text class="m" x="785" y="355" text-anchor="middle" font-size="9.5">per-user key · AES-256-GCM</text>

  <line class="edge" x1="460" y1="338" x2="460" y2="390" marker-end="url(#ah)"/>

  <!-- Backing services panel -->
  <rect class="panel" x="36" y="388" width="848" height="142" rx="12"/>
  <text class="m" x="54" y="410" font-size="11" font-weight="700" letter-spacing="0.5">BACKING SERVICES &amp; EXTERNAL APIS</text>

  <rect class="card" x="52" y="420" width="192" height="96" rx="10" filter="url(#sh)"/>
  <text class="e" x="148" y="452" text-anchor="middle" font-size="14" font-weight="700">better-sqlite3</text>
  <text class="m" x="148" y="474" text-anchor="middle" font-size="10.8">SQLite · WAL mode</text>
  <text class="m" x="148" y="491" text-anchor="middle" font-size="10.8">sessions · jobs · cache</text>
  <text class="m" x="148" y="508" text-anchor="middle" font-size="9.5">optional Redis · no Postgres</text>

  <rect class="card" x="260" y="420" width="192" height="96" rx="10" filter="url(#sh)"/>
  <text class="b" x="356" y="452" text-anchor="middle" font-size="14" font-weight="700">GitHub REST API</text>
  <text class="m" x="356" y="474" text-anchor="middle" font-size="10.8">v2022-11-28 · OAuth 2.0</text>
  <text class="m" x="356" y="491" text-anchor="middle" font-size="10.8">ETag cache · rate-limit</text>
  <text class="m" x="356" y="508" text-anchor="middle" font-size="9.5">gh-cache · gh-outbox</text>

  <rect class="card" x="468" y="420" width="192" height="96" rx="10" filter="url(#sh)"/>
  <text class="b" x="564" y="452" text-anchor="middle" font-size="14" font-weight="700">Azure DevOps v7.1</text>
  <text class="m" x="564" y="474" text-anchor="middle" font-size="10.8">Git · TFVC · Boards</text>
  <text class="m" x="564" y="491" text-anchor="middle" font-size="10.8">Wikis · PAT auth</text>
  <text class="m" x="564" y="508" text-anchor="middle" font-size="9.5">import &amp; migration</text>

  <rect class="card" x="676" y="420" width="192" height="96" rx="10" filter="url(#sh)"/>
  <text class="v" x="772" y="452" text-anchor="middle" font-size="14" font-weight="700">Stripe Billing</text>
  <text class="m" x="772" y="474" text-anchor="middle" font-size="10.8">Checkout · webhooks</text>
  <text class="m" x="772" y="491" text-anchor="middle" font-size="10.8">Free · Pro · Enterprise</text>
  <text class="m" x="772" y="508" text-anchor="middle" font-size="9.5">usage-metered caps</text>

  <rect class="badge-e" x="330" y="550" width="260" height="30" rx="15"/>
  <text class="e" x="460" y="570" text-anchor="middle" font-size="12" font-weight="700">SQLite-only · optional Redis · no PostgreSQL</text>
</svg>
