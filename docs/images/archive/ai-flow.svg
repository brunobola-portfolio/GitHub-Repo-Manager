<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="s2" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="780" height="200" rx="12" fill="url(#bg2)"/>

  <!-- Step 1: Your Request -->
  <rect x="20" y="60" width="150" height="80" rx="10" fill="url(#card2)" stroke="#334155" stroke-width="1" filter="s2"/>
  <text x="95" y="92" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Your Request</text>
  <text x="95" y="115" text-anchor="middle" fill="#94a3b8" font-size="10">"Analyze my repo"</text>
  <text x="95" y="130" text-anchor="middle" fill="#94a3b8" font-size="10">"Find repos like X"</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="100" x2="220" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Step 2: Decision diamond -->
  <polygon points="290,60 360,100 290,140 220,100" fill="url(#card2)" stroke="#fbbf24" stroke-width="1.5" filter="s2"/>
  <text x="290" y="96" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">API Key</text>
  <text x="290" y="112" text-anchor="middle" fill="#fbbf24" font-size="10">set?</text>

  <!-- Arrow: Yes (top path) -->
  <line x1="360" y1="80" x2="430" y2="55" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="388" y="58" fill="#a78bfa" font-size="10" font-weight="600">Yes</text>

  <!-- Arrow: No (bottom path) -->
  <line x1="360" y1="120" x2="430" y2="145" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="390" y="145" fill="#38bdf8" font-size="10" font-weight="600">No</text>

  <!-- Step 3a: Gemini AI -->
  <rect x="430" y="22" width="180" height="65" rx="10" fill="url(#card2)" stroke="#8b5cf6" stroke-width="1.5" filter="s2"/>
  <rect x="438" y="30" width="70" height="18" rx="9" fill="url(#violet)"/>
  <text x="473" y="43" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">GEMINI AI</text>
  <text x="520" y="58" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="500">Full AI analysis</text>
  <text x="520" y="74" text-anchor="middle" fill="#94a3b8" font-size="10">Semantic search + Embeddings</text>

  <!-- Step 3b: Programmatic -->
  <rect x="430" y="112" width="180" height="65" rx="10" fill="url(#card2)" stroke="#0ea5e9" stroke-width="1.5" filter="s2"/>
  <rect x="438" y="120" width="90" height="18" rx="9" fill="url(#sky)"/>
  <text x="483" y="133" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">ALGORITHMIC</text>
  <text x="520" y="150" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="500">Smart fallbacks</text>
  <text x="520" y="166" text-anchor="middle" fill="#94a3b8" font-size="10">Pattern detection + Scoring</text>

  <!-- Arrows to Result -->
  <line x1="610" y1="55" x2="650" y2="85" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="610" y1="145" x2="650" y2="115" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Step 4: Result -->
  <rect x="650" y="60" width="110" height="80" rx="10" fill="url(#card2)" stroke="#10b981" stroke-width="1.5" filter="s2"/>
  <rect x="662" y="70" width="50" height="18" rx="9" fill="url(#emerald)"/>
  <text x="687" y="83" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">RESULT</text>
  <text x="705" y="107" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="500">Quality report</text>
  <text x="705" y="123" text-anchor="middle" fill="#94a3b8" font-size="10">Suggestions</text>
  <text x="705" y="137" text-anchor="middle" fill="#94a3b8" font-size="10">Search results</text>
</svg>
