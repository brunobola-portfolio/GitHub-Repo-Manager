<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="adBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="adCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="adViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="adAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="adEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="adSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="adShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="adArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="adArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="840" height="280" rx="12" fill="url(#adBg)"/>

  <!-- Title pill -->
  <rect x="20" y="16" width="260" height="24" rx="12" fill="url(#adViolet)" filter="url(#adShadow)"/>
  <text x="150" y="33" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">CONVERSATIONAL TASK AUTOMATION · v3.3.0</text>

  <!-- Step 1: User intent -->
  <rect x="20" y="58" width="150" height="78" rx="10" fill="url(#adCard)" stroke="#334155" stroke-width="1" filter="url(#adShadow)"/>
  <text x="95" y="82" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">User intent</text>
  <text x="95" y="102" text-anchor="middle" fill="#94a3b8" font-size="10">"migrate from Azure"</text>
  <text x="95" y="118" text-anchor="middle" fill="#94a3b8" font-size="10">"create a repo"</text>
  <text x="95" y="131" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">free text, any phrasing</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="97" x2="200" y2="97" stroke="#64748b" stroke-width="1.5" marker-end="url(#adArrow)"/>

  <!-- Step 2: Gemini -->
  <rect x="200" y="58" width="160" height="78" rx="10" fill="url(#adCard)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#adShadow)"/>
  <rect x="208" y="66" width="70" height="18" rx="9" fill="url(#adViolet)"/>
  <text x="243" y="79" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">GEMINI AI</text>
  <text x="280" y="102" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="500">Returns reply +</text>
  <text x="280" y="117" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="500">structured actions</text>
  <text x="280" y="131" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">JSON: { type, label }</text>

  <!-- Arrow 2 -->
  <line x1="360" y1="97" x2="390" y2="97" stroke="#64748b" stroke-width="1.5" marker-end="url(#adArrow)"/>

  <!-- Step 3: Validation -->
  <rect x="390" y="58" width="160" height="78" rx="10" fill="url(#adCard)" stroke="#fbbf24" stroke-width="1.5" filter="url(#adShadow)"/>
  <rect x="398" y="66" width="92" height="18" rx="9" fill="url(#adAmber)"/>
  <text x="444" y="79" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">ALLOW-LIST</text>
  <text x="470" y="102" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="500">sanitizeActions</text>
  <text x="470" y="117" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="500">validateAction</text>
  <text x="470" y="131" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">strict schema, dedup</text>

  <!-- Arrow 3 (valid) -->
  <line x1="550" y1="97" x2="580" y2="97" stroke="#64748b" stroke-width="1.5" marker-end="url(#adArrow)"/>

  <!-- Step 4: Dispatch / UI change -->
  <rect x="580" y="58" width="160" height="78" rx="10" fill="url(#adCard)" stroke="#10b981" stroke-width="1.5" filter="url(#adShadow)"/>
  <rect x="588" y="66" width="68" height="18" rx="9" fill="url(#adEmerald)"/>
  <text x="622" y="79" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">DISPATCH</text>
  <text x="660" y="102" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="500">openModal(entry)</text>
  <text x="660" y="117" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="500">Wizard opens</text>
  <text x="660" y="131" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">UI state change</text>

  <!-- Rejected branch -->
  <line x1="470" y1="136" x2="470" y2="188" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#adArrowRed)"/>
  <text x="500" y="160" fill="#ef4444" font-size="10" font-weight="600">unknown type</text>
  <rect x="380" y="196" width="190" height="44" rx="8" fill="url(#adCard)" stroke="#ef4444" stroke-width="1" filter="url(#adShadow)"/>
  <text x="475" y="217" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">Rejected silently</text>
  <text x="475" y="232" text-anchor="middle" fill="#94a3b8" font-size="9">no arbitrary app mutations</text>

  <!-- Allow-list panel -->
  <rect x="20" y="160" width="340" height="98" rx="10" fill="url(#adCard)" stroke="#334155" stroke-width="1" filter="url(#adShadow)"/>
  <rect x="32" y="168" width="90" height="18" rx="9" fill="url(#adSky)"/>
  <text x="77" y="181" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">ALLOW-LIST</text>
  <text x="135" y="182" fill="#94a3b8" font-size="10" font-style="italic">src/utils/aiActions.js · 5 actions</text>

  <!-- 5 action badges -->
  <rect x="32" y="196" width="155" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="109" y="210" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="ui-monospace, monospace">open_migration_wizard</text>

  <rect x="195" y="196" width="155" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="272" y="210" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="ui-monospace, monospace">open_migration_history</text>

  <rect x="32" y="222" width="100" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="82" y="236" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="ui-monospace, monospace">open_create_repo</text>

  <rect x="140" y="222" width="92" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="186" y="236" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="ui-monospace, monospace">open_transfer</text>

  <rect x="240" y="222" width="92" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="286" y="236" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="ui-monospace, monospace">open_settings</text>

  <!-- Tier availability pill -->
  <rect x="610" y="160" width="210" height="22" rx="11" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="715" y="175" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Free · Pro · Enterprise</text>
  <text x="715" y="200" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">counts toward AI queries cap</text>
</svg>
