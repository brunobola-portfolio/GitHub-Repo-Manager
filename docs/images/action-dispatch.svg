<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Conversational action dispatch: a natural-language user intent goes to the AI (bring-your-own-key) layer, which returns structured actions. The aiActions.js allow-list validates and de-duplicates them, dispatching only known types to the Migration Wizard, Create Repo, Transfer, History and Settings modals plus two payload-validated app events. Any unknown action type is dropped silently.">
  <style>
    svg{--bg:#ffffff;--bg2:#f6f8fa;--card:#ffffff;--stroke:#d0d7de;--text:#1f2328;--muted:#57606a;--blue:#2563eb;--violet:#7c3aed;--emerald:#059669;--amber:#b45309;--red:#cf222e}
    @media (prefers-color-scheme: dark){svg{--bg:#0d1117;--bg2:#161b22;--card:#1c2128;--stroke:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#4f8cff;--violet:#a78bfa;--emerald:#10b981;--amber:#e3b341;--red:#f85149}}
    .bg{fill:var(--bg)}.panel{fill:var(--bg2);stroke:var(--stroke);stroke-width:1}
    .card{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
    .t{fill:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
    .m{fill:var(--muted);font-family:'Segoe UI',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    .b{fill:var(--blue)}.v{fill:var(--violet)}.e{fill:var(--emerald)}.a{fill:var(--amber)}.r{fill:var(--red)}
    .edge{stroke:var(--muted);stroke-width:1.5;fill:none}
    .edge-e{stroke:var(--emerald);stroke-width:1.5;fill:none}
    .edge-r{stroke:var(--red);stroke-width:1.5;fill:none;stroke-dasharray:5 3}
    .badge-v{fill:var(--violet);fill-opacity:.13;stroke:var(--violet);stroke-width:1}
    .badge-a{fill:var(--amber);fill-opacity:.15;stroke:var(--amber);stroke-width:1}
    .badge-e{fill:var(--emerald);fill-opacity:.13;stroke:var(--emerald);stroke-width:1}
    .badge-r{fill:var(--red);fill-opacity:.12;stroke:var(--red);stroke-width:1}
    .pill-e{fill:var(--emerald);fill-opacity:.10;stroke:var(--emerald);stroke-width:1.2}
    .ah{fill:var(--muted)}.ahe{fill:var(--emerald)}.ahr{fill:var(--red)}
  </style>
  <defs>
    <filter id="sh" x="-20%" y="-25%" width="140%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.12"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
    <marker id="ahe" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahe"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahr"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="420" rx="14"/>
  <text class="t" x="32" y="42" font-size="19" font-weight="700">Conversational Action Dispatch</text>
  <text class="m" x="32" y="64" font-size="12.5">Natural-language intent &#8594; allow-listed app actions — unknown types are dropped</text>

  <!-- Top flow -->
  <rect class="card" x="40" y="82" width="210" height="90" rx="10" filter="url(#sh)"/>
  <text class="t" x="145" y="110" text-anchor="middle" font-size="14" font-weight="700">User intent</text>
  <text class="m" x="145" y="132" text-anchor="middle" font-size="10.5">"migrate from Azure"</text>
  <text class="m" x="145" y="149" text-anchor="middle" font-size="10.5">"create a repo"</text>
  <text class="m" x="145" y="165" text-anchor="middle" font-size="9.5">free text · any phrasing</text>

  <line class="edge" x1="250" y1="127" x2="292" y2="127" marker-end="url(#ah)"/>

  <rect class="card" x="292" y="82" width="210" height="90" rx="10" filter="url(#sh)"/>
  <rect class="badge-v" x="304" y="92" width="96" height="22" rx="11"/>
  <text class="v" x="352" y="107" text-anchor="middle" font-size="11.5" font-weight="700">AI (BYOK)</text>
  <text class="t" x="397" y="134" text-anchor="middle" font-size="11.5" font-weight="600">returns reply + actions</text>
  <text class="m mono" x="397" y="154" text-anchor="middle" font-size="10">JSON { type, label, payload }</text>

  <line class="edge" x1="502" y1="127" x2="544" y2="127" marker-end="url(#ah)"/>

  <rect class="card" x="544" y="82" width="316" height="90" rx="10" filter="url(#sh)"/>
  <rect class="badge-a" x="556" y="92" width="150" height="22" rx="11"/>
  <text class="a" x="631" y="107" text-anchor="middle" font-size="11" font-weight="700">aiActions.js allow-list</text>
  <text class="t mono" x="702" y="136" text-anchor="middle" font-size="11.5" font-weight="600">sanitizeActions · validateAction</text>
  <text class="m" x="702" y="156" text-anchor="middle" font-size="10.5">strict schema · dedup · unknown keys dropped</text>

  <!-- Dispatch panel (lower-left) -->
  <line class="edge-e" x1="640" y1="172" x2="330" y2="212" marker-end="url(#ahe)"/>
  <rect class="panel" x="40" y="214" width="556" height="176" rx="12"/>
  <rect class="badge-e" x="56" y="226" width="150" height="22" rx="11"/>
  <text class="e" x="131" y="241" text-anchor="middle" font-size="11" font-weight="700">DISPATCH &#8594; APP</text>
  <text class="m mono" x="360" y="241" text-anchor="middle" font-size="9.5">openModal(...) · emitAppEvent(...)</text>

  <!-- 5 modal targets -->
  <rect class="pill-e" x="56" y="258" width="164" height="34" rx="9"/>
  <text class="e" x="138" y="280" text-anchor="middle" font-size="12" font-weight="600">Migration Wizard</text>
  <rect class="pill-e" x="232" y="258" width="164" height="34" rx="9"/>
  <text class="e" x="314" y="280" text-anchor="middle" font-size="12" font-weight="600">Create Repo</text>
  <rect class="pill-e" x="408" y="258" width="164" height="34" rx="9"/>
  <text class="e" x="490" y="280" text-anchor="middle" font-size="12" font-weight="600">Transfer</text>
  <rect class="pill-e" x="56" y="302" width="164" height="34" rx="9"/>
  <text class="e" x="138" y="324" text-anchor="middle" font-size="12" font-weight="600">History</text>
  <rect class="pill-e" x="232" y="302" width="164" height="34" rx="9"/>
  <text class="e" x="314" y="324" text-anchor="middle" font-size="12" font-weight="600">Settings</text>
  <rect class="badge-v" x="408" y="302" width="164" height="34" rx="9"/>
  <text class="v" x="490" y="324" text-anchor="middle" font-size="11.5" font-weight="600">+2 app events</text>

  <text class="m mono" x="56" y="360" font-size="9.6">AI_ACTION_TYPES (7): 5 modal + 2 payload-validated events</text>
  <text class="m mono" x="56" y="377" font-size="9.6">events &#8594; open_repo_settings · open_ai_polish</text>

  <!-- Reject path (lower-right) -->
  <line class="edge-r" x1="760" y1="172" x2="742" y2="248" marker-end="url(#ahr)"/>
  <text class="r" x="770" y="212" font-size="10" font-weight="600">unknown type</text>
  <rect class="badge-r" x="624" y="250" width="236" height="140" rx="12"/>
  <text class="r" x="742" y="292" text-anchor="middle" font-size="13" font-weight="700">Dropped silently</text>
  <text class="m" x="742" y="318" text-anchor="middle" font-size="11">type not in allow-list</text>
  <text class="m" x="742" y="338" text-anchor="middle" font-size="11">no arbitrary app mutation</text>
  <text class="m" x="742" y="362" text-anchor="middle" font-size="10">the allow-list is the gate</text>
</svg>
