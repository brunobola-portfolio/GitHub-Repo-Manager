<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-label="Windows first-run flow: Start.cmd launches the bundled runtime, first run generates a local .env with four random secrets (idempotent — if .env already exists it is left untouched and the flow proceeds unchanged), a port check falls back to the next free port if the configured one is busy, the server boots bound to 127.0.0.1 with data under DATA_DIR, and once the health check passes the browser opens.">
  <style>
    svg{--bg:#ffffff;--bg2:#f6f8fa;--card:#ffffff;--stroke:#d0d7de;--text:#1f2328;--muted:#57606a;--blue:#2563eb;--violet:#7c3aed;--emerald:#059669;--amber:#b45309;--red:#cf222e}
    @media (prefers-color-scheme: dark){svg{--bg:#0d1117;--bg2:#161b22;--card:#1c2128;--stroke:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#4f8cff;--violet:#a78bfa;--emerald:#10b981;--amber:#e3b341;--red:#f85149}}
    .bg{fill:var(--bg)}.panel{fill:var(--bg2);stroke:var(--stroke);stroke-width:1}
    .card{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
    .t{fill:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
    .m{fill:var(--muted);font-family:'Segoe UI',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    .b{fill:var(--blue)}.v{fill:var(--violet)}.e{fill:var(--emerald)}.a{fill:var(--amber)}
    .edge{stroke:var(--muted);stroke-width:1.5;fill:none}
    .edge-d{stroke:var(--amber);stroke-width:1.5;fill:none;stroke-dasharray:5 3}
    .badge-b{fill:var(--blue);fill-opacity:.13;stroke:var(--blue);stroke-width:1}
    .badge-v{fill:var(--violet);fill-opacity:.13;stroke:var(--violet);stroke-width:1}
    .badge-e{fill:var(--emerald);fill-opacity:.13;stroke:var(--emerald);stroke-width:1}
    .badge-a{fill:var(--amber);fill-opacity:.15;stroke:var(--amber);stroke-width:1}
    .ah{fill:var(--muted)}.ahd{fill:var(--amber)}
  </style>
  <defs>
    <filter id="sh" x="-20%" y="-25%" width="140%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.12"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahd"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="380" rx="14"/>
  <text class="t" x="20" y="38" font-size="19" font-weight="700">Windows First-Run Flow</text>
  <text class="m" x="20" y="60" font-size="12.5">Start.cmd &#8594; first run &#8594; port check &#8594; boot &#8594; browser opens — safe to re-run every launch</text>

  <!-- 1 Start.cmd -->
  <rect class="card" x="20" y="96" width="172" height="150" rx="10" filter="url(#sh)"/>
  <rect class="badge-b" x="34" y="108" width="22" height="22" rx="11"/><text class="b" x="45" y="123.5" text-anchor="middle" font-size="11" font-weight="700">1</text>
  <text class="t" x="106" y="150" text-anchor="middle" font-size="12.5" font-weight="700">Start.cmd</text>
  <text class="m" x="106" y="172" text-anchor="middle" font-size="9.8">launches the bundled</text>
  <text class="m" x="106" y="188" text-anchor="middle" font-size="9.8">Node runtime</text>
  <text class="m mono" x="106" y="210" text-anchor="middle" font-size="9">start.ps1</text>

  <line class="edge" x1="192" y1="171" x2="216" y2="171" marker-end="url(#ah)"/>

  <!-- 2 First run -->
  <rect class="card" x="217" y="96" width="172" height="150" rx="10" filter="url(#sh)"/>
  <rect class="badge-v" x="231" y="108" width="22" height="22" rx="11"/><text class="v" x="242" y="123.5" text-anchor="middle" font-size="11" font-weight="700">2</text>
  <text class="t" x="303" y="150" text-anchor="middle" font-size="12.5" font-weight="700">First run</text>
  <rect class="badge-e" x="255" y="160" width="96" height="18" rx="9"/>
  <text class="e" x="303" y="173" text-anchor="middle" font-size="8.5" font-weight="700">IDEMPOTENT</text>
  <text class="m" x="303" y="196" text-anchor="middle" font-size="9.8">generates local .env</text>
  <text class="m" x="303" y="212" text-anchor="middle" font-size="9.8">4 random secrets</text>

  <line class="edge" x1="389" y1="171" x2="413" y2="171" marker-end="url(#ah)"/>

  <!-- dashed idempotency branch under card 2 -->
  <path class="edge-d" d="M303 246 L303 286 L413 286 L413 250" marker-end="url(#ahd)" fill="none"/>
  <text class="a" x="358" y="302" text-anchor="middle" font-size="9.3" font-weight="600">.env exists &#8594; untouched</text>

  <!-- 3 Port check -->
  <rect class="card" x="414" y="96" width="172" height="150" rx="10" filter="url(#sh)"/>
  <rect class="badge-a" x="428" y="108" width="22" height="22" rx="11"/><text class="a" x="439" y="123.5" text-anchor="middle" font-size="11" font-weight="700">3</text>
  <text class="t" x="500" y="150" text-anchor="middle" font-size="12.5" font-weight="700">Port check</text>
  <rect class="badge-a" x="452" y="160" width="96" height="18" rx="9"/>
  <text class="a" x="500" y="173" text-anchor="middle" font-size="8.5" font-weight="700">FALLBACK</text>
  <text class="m" x="500" y="196" text-anchor="middle" font-size="9.8">configured port busy?</text>
  <text class="m" x="500" y="212" text-anchor="middle" font-size="9.8">use next free port</text>

  <line class="edge" x1="586" y1="171" x2="610" y2="171" marker-end="url(#ah)"/>

  <!-- 4 Boot -->
  <rect class="card" x="611" y="96" width="172" height="150" rx="10" filter="url(#sh)"/>
  <rect class="badge-b" x="625" y="108" width="22" height="22" rx="11"/><text class="b" x="636" y="123.5" text-anchor="middle" font-size="11" font-weight="700">4</text>
  <text class="t" x="697" y="150" text-anchor="middle" font-size="12.5" font-weight="700">Boot</text>
  <text class="m mono" x="697" y="174" text-anchor="middle" font-size="9.8">127.0.0.1 only</text>
  <text class="m" x="697" y="194" text-anchor="middle" font-size="9.8">data under</text>
  <text class="m mono" x="697" y="211" text-anchor="middle" font-size="9.3">DATA_DIR</text>

  <line class="edge" x1="783" y1="171" x2="807" y2="171" marker-end="url(#ah)"/>

  <!-- 5 Ready -->
  <rect class="card" x="808" y="96" width="172" height="150" rx="10" filter="url(#sh)"/>
  <rect class="badge-e" x="822" y="108" width="22" height="22" rx="11"/><text class="e" x="833" y="123.5" text-anchor="middle" font-size="11" font-weight="700">5</text>
  <text class="t" x="894" y="150" text-anchor="middle" font-size="12.5" font-weight="700">Ready</text>
  <text class="m" x="894" y="174" text-anchor="middle" font-size="9.8">health check OK</text>
  <text class="m" x="894" y="194" text-anchor="middle" font-size="9.8">browser opens</text>
  <text class="m mono" x="894" y="211" text-anchor="middle" font-size="9">localhost</text>

  <!-- Footer caption -->
  <rect class="panel" x="20" y="326" width="940" height="40" rx="10"/>
  <text class="e" x="490" y="351" text-anchor="middle" font-size="11" font-weight="700">Every step is safe to re-run — an existing .env is never overwritten, and a busy port never blocks the launch</text>
</svg>
