<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="280" y1="140" x2="400" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>
  <!-- Git branch / repo tree -->
  <!-- Main vertical line -->
  <line x1="190" y1="130" x2="190" y2="382" stroke="white" stroke-width="32" stroke-linecap="round"/>
  <!-- Branch line going right -->
  <path d="M190 220 C230 220, 260 180, 300 180" stroke="white" stroke-width="32" stroke-linecap="round" fill="none"/>
  <!-- Second branch line going right-down -->
  <path d="M190 310 C230 310, 260 340, 310 340" stroke="white" stroke-width="32" stroke-linecap="round" fill="none"/>
  <!-- Node dots on main line -->
  <circle cx="190" cy="140" r="26" fill="white"/>
  <circle cx="190" cy="220" r="22" fill="white"/>
  <circle cx="190" cy="310" r="22" fill="white"/>
  <circle cx="190" cy="382" r="26" fill="white"/>
  <!-- Branch endpoint dots (cyan accent) -->
  <circle cx="310" cy="180" r="26" fill="url(#accent)" stroke="white" stroke-width="8"/>
  <circle cx="320" cy="340" r="26" fill="url(#accent)" stroke="white" stroke-width="8"/>
  <!-- Small arrow/chevron suggesting management/direction -->
  <path d="M355 240 L390 270 L355 300" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>
</svg>
