<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background gradient: deep indigo to rich violet -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="45%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <!-- Subtle shine overlay -->
    <linearGradient id="shine" x1="0" y1="0" x2="512" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Central glow -->
    <radialGradient id="glow" cx="256" cy="240" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <!-- Cyan accent gradient -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- Indigo node gradient -->
    <linearGradient id="indigo-node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <!-- Connection line gradient -->
    <linearGradient id="line-grad" x1="256" y1="240" x2="380" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="line-grad2" x1="256" y1="240" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="line-grad3" x1="256" y1="240" x2="160" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="line-grad4" x1="256" y1="240" x2="370" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Outer ring gradient -->
    <linearGradient id="ring" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Glow filters -->
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
    <filter id="center-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="512" height="512" rx="108" fill="url(#shine)"/>

  <!-- Central ambient glow -->
  <circle cx="256" cy="240" r="140" fill="url(#glow)"/>

  <!-- Orbital ring (subtle) -->
  <ellipse cx="256" cy="248" rx="145" ry="130" stroke="url(#ring)" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Connection lines from center to nodes (glowing) -->
  <!-- Line glow layer -->
  <line x1="256" y1="240" x2="370" y2="142" stroke="#818cf8" stroke-width="6" stroke-linecap="round" filter="url(#soft-glow)" opacity="0.5"/>
  <line x1="256" y1="240" x2="148" y2="152" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" filter="url(#soft-glow)" opacity="0.4"/>
  <line x1="256" y1="240" x2="155" y2="358" stroke="#c084fc" stroke-width="6" stroke-linecap="round" filter="url(#soft-glow)" opacity="0.4"/>
  <line x1="256" y1="240" x2="368" y2="348" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" filter="url(#soft-glow)" opacity="0.4"/>

  <!-- Connection lines (crisp) -->
  <line x1="256" y1="240" x2="370" y2="142" stroke="url(#line-grad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="240" x2="148" y2="152" stroke="url(#line-grad2)" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="240" x2="155" y2="358" stroke="url(#line-grad3)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="256" y1="240" x2="368" y2="348" stroke="url(#line-grad4)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Secondary connection (node-to-node arc) -->
  <path d="M370 142 Q 410 245, 368 348" stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M148 152 Q 100 250, 155 358" stroke="#a78bfa" stroke-width="1.5" fill="none" opacity="0.2" stroke-linecap="round"/>

  <!-- Outer repo nodes (glowing halos first) -->
  <!-- Top-right: cyan accent node (primary) -->
  <circle cx="370" cy="142" r="20" fill="#22d3ee" filter="url(#node-glow)" opacity="0.5"/>
  <circle cx="370" cy="142" r="24" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.3"/>
  <circle cx="370" cy="142" r="16" fill="#22d3ee"/>
  <circle cx="370" cy="142" r="8" fill="white" opacity="0.7"/>

  <!-- Top-left: indigo node -->
  <circle cx="148" cy="152" r="16" fill="#a78bfa" filter="url(#node-glow)" opacity="0.4"/>
  <circle cx="148" cy="152" r="20" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.25"/>
  <circle cx="148" cy="152" r="13" fill="#a5b4fc"/>
  <circle cx="148" cy="152" r="6" fill="white" opacity="0.6"/>

  <!-- Bottom-left: purple node -->
  <circle cx="155" cy="358" r="14" fill="#c084fc" filter="url(#node-glow)" opacity="0.35"/>
  <circle cx="155" cy="358" r="18" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.2"/>
  <circle cx="155" cy="358" r="11" fill="#c084fc"/>
  <circle cx="155" cy="358" r="5" fill="white" opacity="0.5"/>

  <!-- Bottom-right: cyan-teal node -->
  <circle cx="368" cy="348" r="15" fill="#06b6d4" filter="url(#node-glow)" opacity="0.4"/>
  <circle cx="368" cy="348" r="19" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.25"/>
  <circle cx="368" cy="348" r="12" fill="#22d3ee"/>
  <circle cx="368" cy="348" r="5.5" fill="white" opacity="0.6"/>

  <!-- CENTRAL HUB (the "Manager") -->
  <!-- Outer glow -->
  <circle cx="256" cy="240" r="42" fill="#818cf8" filter="url(#center-glow)" opacity="0.6"/>
  <!-- Outer ring -->
  <circle cx="256" cy="240" r="34" fill="none" stroke="white" stroke-width="2.5" opacity="0.25"/>
  <!-- Main circle -->
  <circle cx="256" cy="240" r="28" fill="url(#indigo-node)"/>
  <!-- Inner highlight -->
  <circle cx="256" cy="240" r="20" fill="white" opacity="0.15"/>
  <!-- Repo/folder icon inside center (simplified folder shape) -->
  <g transform="translate(256,240)" opacity="0.95">
    <!-- Folder tab -->
    <path d="M-12,-10 L-5,-10 L-2,-14 L8,-14 L8,-10 L12,-10 L12,10 L-12,10 Z" fill="white" opacity="0.9"/>
    <!-- Folder body accent line -->
    <line x1="-12" y1="-6" x2="12" y2="-6" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Tiny sparkle dots (atmosphere) -->
  <circle cx="310" cy="190" r="2" fill="white" opacity="0.4"/>
  <circle cx="200" cy="300" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="330" cy="290" r="1.5" fill="#22d3ee" opacity="0.4"/>
  <circle cx="190" cy="200" r="1.5" fill="#a78bfa" opacity="0.35"/>
  <circle cx="300" cy="380" r="1" fill="white" opacity="0.25"/>
  <circle cx="220" cy="140" r="1" fill="white" opacity="0.2"/>
</svg>
