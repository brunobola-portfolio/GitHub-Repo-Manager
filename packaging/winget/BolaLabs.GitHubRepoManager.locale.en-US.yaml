# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json
#
# Winget defaultLocale manifest template - see README.md. ShortDescription
# below is copied byte-for-byte from package.json's "description" field
# (verified verbatim, no trailing punctuation added) so this can never
# silently drift into a claim the product itself doesn't make.
#
# Publisher is the same value scripts/package-windows.mjs's getPublisher()
# derives from package.json's "author" field ("<person> - <company>", the
# company half) - that function is the single source of truth (also used
# for installer.iss's MyAppPublisher /D define); this template is a static
# reference only (wingetcreate generates and submits the real manifest
# itself), so keep this literal in sync with getPublisher()'s output by hand
# if the author field's company name ever changes.

