name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! The more concrete you can be about the *problem* and *who hits it*, the easier it is to prioritise.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point does this address? Who hits it and how often?
      placeholder: |
        I'm always frustrated when [...] because [...].
        This affects [users / contributors / admins] roughly [N] times per [day/week].
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A clear description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about and why they don't fit.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, links to related issues, prior art in other tools.
