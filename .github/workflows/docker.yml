name: Docker

# Builds and publishes the container image to GHCR. Triggered automatically on
# a v* tag, or manually (workflow_dispatch) against any branch/tag — the manual
# path is the fail-safe: if a tag push didn't fire the workflow, an operator can
# re-run it without re-cutting the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build (defaults to the triggering ref)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

# One build per ref; a newer push supersedes an in-flight one.
concurrency:
  group: docker-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # QEMU enables the linux/arm64 leg (Apple Silicon / AWS Graviton self-hosts).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE_LC="${IMAGE_NAME,,}"
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          # Docker tags forbid '/' and other ref chars — sanitize to '-'.
          SAFE_REF="${REF//[^a-zA-Z0-9._-]/-}"
          TAGS="${IMAGE_LC}:${SAFE_REF}"
          # Only advance :latest for real semver version tags, never a branch build.
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            TAGS+=$'\n'"${IMAGE_LC}:latest"
          fi
          {
            echo "tags<<__EOF__"
            echo "$TAGS"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # Build the amd64 leg locally first and boot it once. The public.pem
      # regression (fixed in #227) shipped because build success was the only
      # gate — the image had never been started in CI. This catches
      # boot-aborts (missing bundled files, startup secret checks, native
      # module mismatches) before anything is pushed.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: smoke-test:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — boot the container and hit /api/health/live
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -e NODE_ENV=production \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e WEBHOOK_SECRET="$(openssl rand -hex 32)" \
            -e CREDENTIAL_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e API_KEY_SECRET="$(openssl rand -hex 32)" \
            -e EMAIL_PROVIDER=resend \
            -e RESEND_API_KEY=re_smoke_dummy_key \
            -e EMAIL_FROM=smoke@example.invalid \
            -p 3001:3001 \
            smoke-test:local
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health/live >/dev/null 2>&1; then
              echo "container is live after ${i}s"
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy — boot log follows"
          docker logs smoke
          docker rm -f smoke
          exit 1

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
