name: Docker

# Builds and publishes the container image to GHCR. Triggered automatically on
# a v* tag, or manually (workflow_dispatch) against any branch/tag — the manual
# path is the fail-safe: if a tag push didn't fire the workflow, an operator can
# re-run it without re-cutting the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build (defaults to the triggering ref)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

# One build per ref; a newer push supersedes an in-flight one.
concurrency:
  group: docker-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # One native build per architecture, then a manifest that joins them.
  #
  # Until 4.25.14 this was a single linux/amd64,linux/arm64 build with the arm64
  # leg emulated under QEMU. `npm ci` under emulation hung intermittently and
  # GitHub killed the job at its 6-hour ceiling: no image was published for
  # 4.25.11, 4.25.12 or 4.25.14 while :latest sat on an older release. Native
  # ubuntu-24.04-arm runners remove the emulator entirely, and each leg now
  # boots its own image before anything is pushed.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A native build takes ~5 minutes. A hang should fail in minutes, not
    # burn six hours and leave the release without an image.
    timeout-minutes: 40
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Prepare
        run: |
          set -euo pipefail
          echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          PLATFORM="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and boot the image once before pushing. The public.pem
      # regression (fixed in #227) shipped because build success was the only
      # gate: the image had never been started in CI. This catches boot aborts
      # (missing bundled files, startup secret checks, native module
      # mismatches) on BOTH architectures now that each has a native runner.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: smoke-test:local
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Smoke test — boot the container and hit /api/health/live
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -e NODE_ENV=production \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e WEBHOOK_SECRET="$(openssl rand -hex 32)" \
            -e CREDENTIAL_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e API_KEY_SECRET="$(openssl rand -hex 32)" \
            -e EMAIL_PROVIDER=resend \
            -e RESEND_API_KEY=re_smoke_dummy_key \
            -e EMAIL_FROM=smoke@example.invalid \
            -p 3001:3001 \
            smoke-test:local
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health/live >/dev/null 2>&1; then
              echo "container is live after ${i}s"
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy — boot log follows"
          docker logs smoke
          docker rm -f smoke
          exit 1

      # Pushed by digest only: the human-readable tags are written once, by the
      # merge job, after BOTH architectures have passed their smoke test.
      - name: Push image by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_LC }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest and tag it
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          IMAGE_LC="${IMAGE_NAME,,}"
          count=$(ls -1 | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests, found $count"
            exit 1
          fi
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          # Docker tags forbid '/' and other ref chars — sanitize to '-'.
          SAFE_REF="${REF//[^a-zA-Z0-9._-]/-}"
          TAG_ARGS=(-t "${IMAGE_LC}:${SAFE_REF}")
          # Only advance :latest for real semver version tags, never a branch build.
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            TAG_ARGS+=(-t "${IMAGE_LC}:latest")
          fi
          SOURCES=()
          for d in *; do SOURCES+=("${IMAGE_LC}@sha256:${d}"); done
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"
          docker buildx imagetools inspect "${IMAGE_LC}:${SAFE_REF}"
