name: Ops — IIS proxy

# Operator tooling for the production VPS, run on the same self-hosted runner
# the release deploy uses. Seven actions:
#
#   inspect — print the server-level ARR proxy settings, the site's proxy
#             element, and what /api/auth/login answers from the box itself.
#             Read-only. Run this first.
#   apply   — set the two ARR values the OAuth round-trip depends on:
#             preserveHostHeader=true (Node must see the public Host, or it
#             builds redirect_uri against 127.0.0.1:3001) and
#             reverseRewriteHostInResponseHeaders=false (ARR must not rewrite
#             the Location header that points the browser at github.com).
#             Idempotent; prints the values before and after.
#   app-log — the last warnings and errors from the service log (pino level
#             40 and above) plus every auth event, so a sign-in on the
#             public origin can be checked without RDP. Read-only.
#   env-check — which optional integrations the service's .env configures:
#             SET/unset per name, the Sentry project's host and id, never a
#             secret value. Read-only.
#   sentry-test — send one tagged info event with the service's DSN, to
#             prove delivery from this box. Writes nothing on the server.
#   harden  — hide the ARR version header on the live site (backup, health
#             check, restore on failure).
#   configure-integrations — write Resend and browser-Sentry settings from
#             GitHub (secret RESEND_API_KEY; variables EMAIL_FROM,
#             SENTRY_BROWSER_DSN, SENTRY_ENVIRONMENT) into the service .env,
#             refusing an unverified Resend domain; restarts, rolls back on
#             failure. Never prints a value.
#
# Only harden and configure-integrations write on the server, each with a
# backup taken first and restored automatically if the health check fails.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'inspect (read-only) or apply'
        required: true
        default: inspect
        type: choice
        options: [inspect, apply, app-log, env-check, sentry-test, harden, configure-integrations]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  iis:
    runs-on: [self-hosted, Windows, bolalabs-vps]
    steps:
      - name: Server-level ARR proxy settings (before)
        shell: pwsh
        run: |
          Import-Module WebAdministration
          $p = Get-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter 'system.webServer/proxy'
          "enabled=$($p.enabled) preserveHostHeader=$($p.preserveHostHeader) reverseRewriteHostInResponseHeaders=$($p.reverseRewriteHostInResponseHeaders) xForwardedForHeaderName=$($p.xForwardedForHeaderName)"

      - name: Site proxy element and rewrite rules
        shell: pwsh
        run: |
          $cfg = Get-ChildItem C:\inetpub -Recurse -Filter web.config -ErrorAction SilentlyContinue |
            Where-Object { Select-String -Path $_.FullName -Pattern 'GRM reverse proxy' -Quiet }
          foreach ($f in $cfg) {
            "--- $($f.FullName)"
            Select-String -Path $f.FullName -Pattern '<proxy|preserveHostHeader|<rule name|action type|X-Forwarded' | ForEach-Object { $_.Line.Trim() }
          }
          if (-not $cfg) { 'no site web.config with the GRM proxy rule found under C:\inetpub' }

      - name: What the login route answers from the box
        shell: pwsh
        run: |
          try {
            $r = Invoke-WebRequest -Uri 'https://repomanager.bolalabs.pt/api/auth/login' -MaximumRedirection 0 -UseBasicParsing -ErrorAction Stop
          } catch { $r = $_.Exception.Response }
          $loc = $r.Headers['Location']
          if ($loc -is [array]) { $loc = $loc[0] }
          "status=$([int]$r.StatusCode)"
          "location=" + ($loc -replace 'client_id=[^&]*', 'client_id=…')

      - name: Apply the two ARR values
        if: ${{ inputs.action == 'apply' }}
        shell: pwsh
        run: |
          Import-Module WebAdministration
          Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter 'system.webServer/proxy' -Name 'preserveHostHeader' -Value $true
          Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter 'system.webServer/proxy' -Name 'reverseRewriteHostInResponseHeaders' -Value $false
          $p = Get-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter 'system.webServer/proxy'
          "after: preserveHostHeader=$($p.preserveHostHeader) reverseRewriteHostInResponseHeaders=$($p.reverseRewriteHostInResponseHeaders)"
          if (-not $p.preserveHostHeader -or $p.reverseRewriteHostInResponseHeaders) { throw 'ARR values did not stick' }

      - name: Login route after the change
        if: ${{ inputs.action == 'apply' }}
        shell: pwsh
        run: |
          Start-Sleep -Seconds 3
          try {
            $r = Invoke-WebRequest -Uri 'https://repomanager.bolalabs.pt/api/auth/login' -MaximumRedirection 0 -UseBasicParsing -ErrorAction Stop
          } catch { $r = $_.Exception.Response }
          $loc = $r.Headers['Location']
          if ($loc -is [array]) { $loc = $loc[0] }
          "location=" + ($loc -replace 'client_id=[^&]*', 'client_id=…')
          if ($loc -notmatch '^https://github\.com/login/oauth/authorize') { throw "Location still does not point at github.com: $loc" }
          if ($loc -notmatch 'redirect_uri=https%3A%2F%2Frepomanager\.bolalabs\.pt%2Fapi%2Fauth%2Fcallback') { throw "redirect_uri is not the public origin: $loc" }

      - name: Production .env — which optional integrations are configured (names only)
        if: ${{ inputs.action == 'env-check' }}
        shell: pwsh
        run: |
          # Answers "is Sentry / Resend / Stripe wired on this box?" without
          # ever printing a value: each line is the variable name and SET or
          # unset. The .env is the one the service reads (deploy.ps1 writes
          # DATA_DIR there); values never leave the runner.
          $env = 'C:\ProgramData\GitHubRepoManager\data\.env'
          if (-not (Test-Path $env)) { throw ".env not found at $env" }
          $map = @{}
          foreach ($line in Get-Content $env) {
            if ($line -match '^\s*([A-Z0-9_]+)\s*=\s*(.*)$') { $map[$matches[1]] = $matches[2].Trim().Trim('"').Trim("'") }
          }
          foreach ($k in 'NODE_ENV','FRONTEND_URL','EMAIL_PROVIDER','RESEND_API_KEY','EMAIL_FROM','ALLOW_CONSOLE_EMAIL','SENTRY_DSN','SENTRY_BROWSER_DSN','SENTRY_ENVIRONMENT','STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET','WORK_BOARD_AI_ENABLED','AI_PROVIDER','GEMINI_API_KEY','DATA_RETENTION_DAYS') {
            $v = $map[$k]
            $state = if ([string]::IsNullOrWhiteSpace($v)) { 'unset' } else { 'SET' }
            $shown = if ($k -in 'NODE_ENV','FRONTEND_URL','EMAIL_PROVIDER','EMAIL_FROM','ALLOW_CONSOLE_EMAIL','WORK_BOARD_AI_ENABLED','AI_PROVIDER','DATA_RETENTION_DAYS','SENTRY_ENVIRONMENT') { " = $v" } else { '' }
            # A DSN's host and project id say which Sentry organisation receives
            # the events; the public key in front of the @ is left out.
            if ($k -like 'SENTRY*DSN' -and $v) { try { $u = [Uri]$v; $shown = " (host $($u.Host), project $($u.AbsolutePath.Trim('/')))" } catch { $shown = ' (not a valid URL)' } }
            "{0,-24} {1}{2}" -f $k, $state, $shown
          }

      - name: Harden — hide the ARR version header on the live site
        if: ${{ inputs.action == 'harden' }}
        shell: pwsh
        run: |
          # Adds the same outbound rule deploy/iis/web.config ships, to the
          # web.config the RepoManager site actually serves. Backed up first,
          # checked from the box, restored if the site stops answering.
          $cfgPath = 'C:\inetpub\repomanager\web.config'
          if (-not (Test-Path $cfgPath)) { throw "$cfgPath not found" }
          $backup = "$cfgPath.bak-$(Get-Date -Format yyyyMMdd-HHmmss)"
          Copy-Item $cfgPath $backup
          [xml]$x = Get-Content $cfgPath -Raw
          $ws = $x.configuration.'system.webServer'
          $rewrite = $ws.SelectSingleNode('rewrite')
          if (-not $rewrite) { throw 'no <rewrite> section — not the GRM proxy web.config' }
          $outbound = $rewrite.SelectSingleNode('outboundRules')
          if (-not $outbound) { $outbound = $x.CreateElement('outboundRules'); [void]$rewrite.AppendChild($outbound) }
          if ($outbound.SelectSingleNode("rule[@name='GRM hide ARR version']")) {
            'rule already present'
          } else {
            $rule = $x.CreateElement('rule'); $rule.SetAttribute('name', 'GRM hide ARR version')
            $match = $x.CreateElement('match'); $match.SetAttribute('serverVariable', 'RESPONSE_X-Powered-By'); $match.SetAttribute('pattern', '.+')
            $act = $x.CreateElement('action'); $act.SetAttribute('type', 'Rewrite'); $act.SetAttribute('value', '')
            [void]$rule.AppendChild($match); [void]$rule.AppendChild($act); [void]$outbound.AppendChild($rule)
            $x.Save($cfgPath)
            'rule added'
          }
          Start-Sleep -Seconds 2
          try {
            $r = Invoke-WebRequest -Uri 'https://repomanager.bolalabs.pt/api/health' -UseBasicParsing -TimeoutSec 15
          } catch { $r = $null }
          if (-not $r -or $r.StatusCode -ne 200) {
            Copy-Item $backup $cfgPath -Force
            throw 'site stopped answering after the change — web.config restored'
          }
          "health $($r.StatusCode); X-Powered-By now: '$($r.Headers['X-Powered-By'])'"

      - name: Configure integrations — Resend and browser Sentry from GitHub secrets/variables
        if: ${{ inputs.action == 'configure-integrations' }}
        shell: pwsh
        env:
          IN_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          IN_EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          IN_SENTRY_BROWSER_DSN: ${{ vars.SENTRY_BROWSER_DSN }}
          IN_SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
        run: |
          # Writes only what is set in GitHub (secret RESEND_API_KEY; variables
          # EMAIL_FROM, SENTRY_BROWSER_DSN, SENTRY_ENVIRONMENT) into the
          # service's .env, never prints a value, refuses a Resend key whose
          # sending domain is not verified, restarts the service and puts the
          # old .env back if the health check fails.
          $envFile = 'C:\ProgramData\GitHubRepoManager\data\.env'
          if (-not (Test-Path $envFile)) { throw ".env not found at $envFile" }
          $lines = [System.Collections.Generic.List[string]](Get-Content $envFile)
          $changed = @()
          function Set-Line([string]$key, [string]$value) {
            $i = $lines.FindIndex([Predicate[string]]{ param($l) $l -match "^\s*$key\s*=" })
            if ($i -ge 0) { $lines[$i] = "$key=$value" } else { $lines.Add("$key=$value") }
            $script:changed += $key
          }
          function Remove-Line([string]$key) {
            $n = $lines.RemoveAll([Predicate[string]]{ param($l) $l -match "^\s*$key\s*=" })
            if ($n -gt 0) { $script:changed += "-$key" }
          }

          if ($env:IN_RESEND_API_KEY) {
            $from = if ($env:IN_EMAIL_FROM) { $env:IN_EMAIL_FROM } else { 'no-reply@bolalabs.pt' }
            $domain = $from.Split('@')[-1]
            $domains = Invoke-RestMethod -Uri 'https://api.resend.com/domains' -Headers @{ Authorization = "Bearer $($env:IN_RESEND_API_KEY)" } -TimeoutSec 20
            $d = @($domains.data) | Where-Object { $_.name -eq $domain } | Select-Object -First 1
            if (-not $d) { throw "Resend has no domain '$domain' — add it at resend.com/domains first" }
            if ($d.status -ne 'verified') { throw "Resend domain '$domain' is '$($d.status)', not verified — finish the DNS records first" }
            "Resend domain $domain verified"
            Set-Line 'EMAIL_PROVIDER' 'resend'
            Set-Line 'RESEND_API_KEY' $env:IN_RESEND_API_KEY
            Set-Line 'EMAIL_FROM' $from
            Remove-Line 'ALLOW_CONSOLE_EMAIL'
          }
          if ($env:IN_SENTRY_BROWSER_DSN) { Set-Line 'SENTRY_BROWSER_DSN' $env:IN_SENTRY_BROWSER_DSN }
          if ($env:IN_SENTRY_ENVIRONMENT) { Set-Line 'SENTRY_ENVIRONMENT' $env:IN_SENTRY_ENVIRONMENT }
          if ($changed.Count -eq 0) { 'nothing set in GitHub — add the secret/variables first'; exit 0 }

          $backup = "$envFile.bak-$(Get-Date -Format yyyyMMdd-HHmmss)"
          Copy-Item $envFile $backup
          Set-Content -Path $envFile -Value $lines
          "updated: $($changed -join ', ')"
          Restart-Service GitHubRepoManager
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try { $h = Invoke-RestMethod -Uri 'http://127.0.0.1:3001/api/health' -TimeoutSec 5; if ($h.status -eq 'ok') { $ok = $true; break } } catch { }
          }
          if (-not $ok) {
            Copy-Item $backup $envFile -Force
            Restart-Service GitHubRepoManager
            throw 'service did not come back healthy — previous .env restored and service restarted'
          }
          "service healthy on $($h.version)"

      - name: Sentry — send one test event with the service's own DSN
        if: ${{ inputs.action == 'sentry-test' }}
        shell: pwsh
        run: |
          # Proves delivery end to end: the installed @sentry/node, the DSN the
          # service reads, and the network path from this box to Sentry. The
          # event is a plain message, tagged so it is easy to find and resolve.
          $envFile = 'C:\ProgramData\GitHubRepoManager\data\.env'
          $dsn = (Get-Content $envFile | Where-Object { $_ -match '^\s*SENTRY_DSN\s*=' } | Select-Object -First 1) -replace '^\s*SENTRY_DSN\s*=\s*', '' -replace '^["'']|["'']$', ''
          if (-not $dsn) { throw 'SENTRY_DSN is not set in the service .env' }
          $app = 'C:\apps\GitHubRepoManager'
          if (-not (Test-Path (Join-Path $app 'node_modules\@sentry\node'))) { throw "@sentry/node not found under $app" }
          $env:SENTRY_DSN = $dsn
          Push-Location $app
          try {
            node --input-type=module -e "const S = await import('@sentry/node'); S.init({ dsn: process.env.SENTRY_DSN, environment: 'production', sendDefaultPii: false }); const id = S.captureMessage('GitHub Repo Manager: Sentry delivery test from the VPS', { level: 'info', tags: { source: 'ops-iis/sentry-test' } }); const ok = await S.flush(8000); console.log('event ' + id + (ok ? ' delivered' : ' NOT flushed within 8 s'));"
          } finally { Pop-Location }

      - name: Service log — warnings, errors and auth events
        if: ${{ inputs.action == 'app-log' }}
        shell: pwsh
        run: |
          $dir = 'C:\ProgramData\GitHubRepoManager\data\logs'
          foreach ($name in 'service-err.log', 'service-out.log') {
            $f = Join-Path $dir $name
            if (-not (Test-Path $f)) { "--- ${name}: not found"; continue }
            "--- $name (last 400 lines, filtered)"
            Get-Content $f -Tail 400 | Where-Object {
              $_ -match '"level":(40|50|60)' -or $_ -match 'auth\.(login|callback|logout)|/api/auth/callback|oauth' -or $_ -match '(?i)error|unhandled|sentry'
            } | Select-Object -Last 60
          }
