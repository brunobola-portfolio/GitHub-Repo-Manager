name: Windows Package

# Builds + boots the Windows distribution (portable ZIP and Inno Setup
# installer) on every PR that touches packaging inputs, and on demand. This
# is the only thing standing between "the packaging script ran" and "the
# packaged app actually works" — every step here is a real boot + HTTP health
# check + graceful stop, never just a file-existence assertion.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/**'
      - 'scripts/package-windows.mjs'
      - 'scripts/first-run.mjs'
      - '.github/workflows/windows-package.yml'
      - '.github/workflows/release.yml'
      # A dependency bump is a packaging input even when it touches no file
      # under packaging/. better-sqlite3 is a native module rebuilt by
      # postinstall and shipped inside the installer, so its major bumps are
      # exactly the change this job exists to catch — and they were sailing
      # past it because the filter only looked at packaging paths.
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-smoke:
    # Must match release.yml's runner exactly — the point of this job is to
    # smoke the artefact the release will actually produce, so a different
    # image would be validating something we never ship. See the note there
    # for why this is pinned rather than windows-latest.
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build production bundle
        env:
          NODE_ENV: production
        run: npm run build

      - name: Package the Windows ZIP
        run: node scripts/package-windows.mjs

      - name: Compute version + paths
        id: meta
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "zipPath=.dev/package-windows/out/github-repo-manager-$version-win-x64.zip" >> $env:GITHUB_OUTPUT
          "setupPath=.dev/package-windows/out/github-repo-manager-$version-setup.exe" >> $env:GITHUB_OUTPUT

      - name: Zip smoke test — extract, boot headless, health-check, stop
        run: |
          $ErrorActionPreference = 'Stop'
          $extractDir = Join-Path $env:RUNNER_TEMP 'grm-zip-smoke'
          Expand-Archive -Path '${{ steps.meta.outputs.zipPath }}' -DestinationPath $extractDir -Force

          $port = 18080
          $env:GRM_NO_BROWSER = '1'
          $env:GRM_PORT = "$port"
          & "$extractDir\Start GitHub Repo Manager.cmd"

          $live = $false
          for ($i = 0; $i -lt 60; $i++) {
              try {
                  $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health/live" -TimeoutSec 2 -UseBasicParsing
                  if ($r.StatusCode -eq 200) { $live = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
          }
          if (-not $live) {
              Write-Host "::error::zip package never became live within 60s"
              Get-Content (Join-Path $extractDir 'data\.env') -ErrorAction SilentlyContinue
              exit 1
          }
          Write-Host "zip package live after ${i}s"

          $ready = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health/ready" -TimeoutSec 5 -UseBasicParsing
          if ($ready.StatusCode -ne 200) {
              Write-Host "::error::zip package /api/health/ready returned $($ready.StatusCode)"
              exit 1
          }

          # Writable state must live in data\, not app\ (v4.8.0 layout): .env
          # holds the credential-vault key and must survive updates/uninstall.
          if (-not (Test-Path (Join-Path $extractDir 'data\.env'))) {
              Write-Host "::error::.env not found at data\.env — first-run wrote it to the wrong place"
              exit 1
          }
          if (Test-Path (Join-Path $extractDir 'app\.env')) {
              Write-Host "::error::legacy app\.env exists — launcher fell back to the pre-4.8.0 layout"
              exit 1
          }

          # Unconfigured-OAuth guard: /api/auth/login must redirect back to the
          # app with a machine-readable code — NOT to GitHub with
          # client_id=undefined (the pre-4.8.0 dead end this test pins down).
          # Raw HttpClient with AllowAutoRedirect=false: Invoke-WebRequest's
          # -MaximumRedirection 0 behavior differs across PS versions.
          $handler = [System.Net.Http.HttpClientHandler]::new()
          $handler.AllowAutoRedirect = $false
          $client = [System.Net.Http.HttpClient]::new($handler)
          $loginResp = $client.GetAsync("http://127.0.0.1:$port/api/auth/login").GetAwaiter().GetResult()
          $loginStatus = [int]$loginResp.StatusCode
          $loc = "$($loginResp.Headers.Location)"
          $client.Dispose()
          if ($loginStatus -lt 300 -or $loginStatus -ge 400 -or $loc -notlike '*error=oauth_not_configured*') {
              Write-Host "::error::/api/auth/login without OAuth config returned $loginStatus Location=$loc — expected a redirect carrying error=oauth_not_configured"
              exit 1
          }
          if ($loc -like '*client_id=undefined*') {
              Write-Host "::error::/api/auth/login redirected to GitHub with client_id=undefined"
              exit 1
          }

          # Guided-setup availability: a loopback client of a fresh install
          # must be offered the in-app OAuth wizard.
          $setup = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/auth/setup-status" -TimeoutSec 5 -UseBasicParsing | ConvertFrom-Json
          if ($setup.oauthConfigured -ne $false -or $setup.canConfigure -ne $true) {
              Write-Host "::error::setup-status returned oauthConfigured=$($setup.oauthConfigured) canConfigure=$($setup.canConfigure) — expected false/true on a fresh loopback install"
              exit 1
          }

          # Session persistence over plain-HTTP loopback: the package runs a
          # production build without TLS, so the session cookie must NOT be
          # marked Secure-only (cookie.secure='auto', server/index.js). If it
          # regresses, no session ever persists → OAuth state dies across the
          # GitHub redirect and CSRF never matches. Two csrf-token reads
          # through one cookie jar must return the SAME token.
          $ws = $null
          $tok1 = (Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/auth/csrf-token" -SessionVariable ws -UseBasicParsing).Content | ConvertFrom-Json
          $tok2 = (Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/auth/csrf-token" -WebSession $ws -UseBasicParsing).Content | ConvertFrom-Json
          if (-not $tok1.token -or $tok1.token -ne $tok2.token) {
              Write-Host "::error::session cookie did not persist across requests over plain HTTP loopback — Secure-cookie regression (login + CSRF are broken in the package)"
              exit 1
          }

          $pidFile = Join-Path $extractDir 'data\.grm.pid'
          $serverPid = Get-Content -LiteralPath $pidFile
          & "$extractDir\Stop GitHub Repo Manager.cmd"
          Start-Sleep -Seconds 2
          if (Get-Process -Id $serverPid -ErrorAction SilentlyContinue) {
              Write-Host "::error::server process $serverPid still running after Stop launcher"
              exit 1
          }
          Write-Host "zip smoke test passed (bundled runtime boots, native module loads, first-run + launchers work headless)"

      - name: Smoke test launcher exe (graceful stop path)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A fresh extraction, separate from the .cmd smoke test's dir above:
          # that dir's data\ already holds today's log file and a used port
          # (18080), so extracting again keeps this run's assertions (log
          # file, port marker, shutdown token) self-contained instead of
          # inheriting leftover state.
          $extractDir = Join-Path $env:RUNNER_TEMP 'grm-exe-smoke'
          Expand-Archive -Path '${{ steps.meta.outputs.zipPath }}' -DestinationPath $extractDir -Force
          Set-Location $extractDir

          $port = 18082
          $env:GRM_PORT = "$port"

          # Helper to dump recent log lines on failures
          function Dump-ServerLog {
              Get-ChildItem 'data\logs\server-*.log' -ErrorAction SilentlyContinue | ForEach-Object {
                  Write-Host "Last 40 lines of $($_.Name):"
                  Get-Content $_.FullName -Tail 40 -ErrorAction SilentlyContinue
              }
          }

          # --start-only: a bare "--no-browser" launch is now the resident tray
          # (stays alive until Quit), which would hang WaitForExit forever.
          # --start-only is the blocking "start the server and return" path.
          # The launcher is a GUI-subsystem exe: PowerShell's & operator does
          # NOT wait for those (and $LASTEXITCODE stays stale). Start-Process
          # -Wait would block on the entire descendant tree (including the
          # long-lived node server), so wait on the launcher alone via .NET
          # WaitForExit instead.
          $launch = Start-Process -FilePath '.\GitHub Repo Manager.exe' -ArgumentList '--start-only','--no-browser' -PassThru
          $launch.WaitForExit()
          if ($launch.ExitCode -ne 0) {
              Dump-ServerLog
              Write-Host "::error::launcher exited $($launch.ExitCode)"
              exit 1
          }

          $live = $false
          for ($i = 0; $i -lt 60; $i++) {
              try {
                  $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health/live" -TimeoutSec 2 -UseBasicParsing
                  if ($r.StatusCode -eq 200) { $live = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
          }
          if (-not $live) {
              Write-Host "::error::server never became live via exe"
              Dump-ServerLog
              exit 1
          }
          if (-not (Test-Path 'data\.grm.shutdown-token')) {
              Dump-ServerLog
              Write-Host "::error::shutdown token missing"
              exit 1
          }
          if (-not (Test-Path 'data\.grm.port')) {
              Dump-ServerLog
              Write-Host "::error::port marker missing"
              exit 1
          }
          $log = Get-ChildItem 'data\logs\server-*.log' | Select-Object -First 1
          if (-not $log -or (Get-Item $log).Length -eq 0) {
              Dump-ServerLog
              Write-Host "::error::log file missing or empty"
              exit 1
          }

          $srvPid = [int](Get-Content 'data\.grm.pid' | Select-Object -First 1)
          $stopProc = Start-Process -FilePath '.\GitHub Repo Manager.exe' -ArgumentList 'stop' -PassThru
          $stopProc.WaitForExit()
          if ($stopProc.ExitCode -ne 0) {
              Dump-ServerLog
              Write-Host "::error::stop exited $($stopProc.ExitCode)"
              exit 1
          }
          if (Get-Process -Id $srvPid -ErrorAction SilentlyContinue) {
              Dump-ServerLog
              Write-Host "::error::server still running after stop"
              exit 1
          }
          if (Test-Path 'data\.grm.shutdown-token') {
              Dump-ServerLog
              Write-Host "::error::token not cleaned up on graceful exit"
              exit 1
          }
          Write-Host "exe smoke test passed — launcher boots headless, stops gracefully, cleans up its shutdown token"

      - name: Portable self-update dry-run smoke (same-version apply-update.ps1 handoff)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.meta.outputs.version }}'
          # A fresh extraction, separate from every other smoke test's dir
          # above — apply-update.ps1 replaces app\ and runtime\ wholesale, so
          # this run must not share state (or a port) with any of them.
          $extractDir = Join-Path $env:RUNNER_TEMP 'grm-update-smoke'
          Expand-Archive -Path '${{ steps.meta.outputs.zipPath }}' -DestinationPath $extractDir -Force

          $dataDir = Join-Path $env:RUNNER_TEMP 'grm-update-smoke-data'
          Remove-Item -Recurse -Force -LiteralPath $dataDir -ErrorAction SilentlyContinue
          $updatesDir = Join-Path $dataDir 'updates'

          # apply-update.ps1 deletes -ZipPath once the swap comes up healthy
          # (see its success path) — operate on a scratch copy so the real
          # build output survives for the upload-artifact step later in this
          # job.
          $zipCopy = Join-Path $env:RUNNER_TEMP 'grm-update-smoke.zip'
          Copy-Item -LiteralPath '${{ steps.meta.outputs.zipPath }}' -Destination $zipCopy -Force

          $port = 18083
          $env:GRM_DATA_DIR = $dataDir
          $env:GRM_PORT = "$port"

          function Dump-ServerLog {
              Get-ChildItem (Join-Path $dataDir 'logs\server-*.log') -ErrorAction SilentlyContinue | ForEach-Object {
                  Write-Host "Last 40 lines of $($_.Name):"
                  Get-Content $_.FullName -Tail 40 -ErrorAction SilentlyContinue
              }
          }
          function Dump-ApplyUpdateLog {
              Get-ChildItem (Join-Path $updatesDir 'apply-update-*.log') -ErrorAction SilentlyContinue | ForEach-Object {
                  Write-Host "---- $($_.Name) ----"
                  Get-Content $_.FullName -ErrorAction SilentlyContinue
              }
          }

          # --start-only (blocking server start), not the resident tray that a
          # bare "--no-browser" now launches — the tray would hang WaitForExit.
          $launch = Start-Process -FilePath (Join-Path $extractDir 'GitHub Repo Manager.exe') -ArgumentList '--start-only','--no-browser' -PassThru
          $launch.WaitForExit()
          if ($launch.ExitCode -ne 0) {
              Dump-ServerLog
              Write-Host "::error::update-smoke launcher exited $($launch.ExitCode)"
              exit 1
          }

          $live = $false
          for ($i = 0; $i -lt 60; $i++) {
              try {
                  $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health/live" -TimeoutSec 2 -UseBasicParsing
                  if ($r.StatusCode -eq 200) { $live = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
          }
          if (-not $live) {
              Write-Host "::error::update-smoke server never became live"
              Dump-ServerLog
              exit 1
          }

          # Simulate the server-side handoff without a GitHub download: the
          # real flow (server/lib/updater.js's runUpdateDownloadAndHandoff)
          # copies apply-update.ps1 into <data>\updates\, writes the intent
          # marker, then spawns the copy. from/to both equal this build's own
          # version — a same-version dry run exercises the full swap +
          # relaunch + boot-resolution path without needing a second release.
          New-Item -ItemType Directory -Force -Path $updatesDir | Out-Null
          $copiedScript = Join-Path $updatesDir 'apply-update.ps1'
          Copy-Item -LiteralPath (Join-Path $extractDir 'apply-update.ps1') -Destination $copiedScript -Force

          $intent = @{ from = $version; to = $version; mode = 'portable'; at = (Get-Date -Format o) } | ConvertTo-Json
          Set-Content -LiteralPath (Join-Path $updatesDir 'update-intent.json') -Value $intent -Encoding utf8

          $srvPid = [int](Get-Content (Join-Path $dataDir '.grm.pid') | Select-Object -First 1)

          # Start-Process -Wait would block on the entire descendant tree
          # (apply-update.ps1 relaunches the long-lived node server as part
          # of a SUCCESSFUL run) — wait on the script process alone via .NET
          # WaitForExit instead, exactly like the exe launcher above.
          $applyProc = Start-Process -FilePath 'powershell.exe' -ArgumentList @(
              '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', $copiedScript,
              '-PackageRoot', $extractDir, '-DataDir', $dataDir, '-ZipPath', $zipCopy,
              '-FromVersion', $version, '-ToVersion', $version,
              '-ServerPid', "$srvPid", '-Port', "$port"
          ) -PassThru
          $applyProc.WaitForExit()
          if ($applyProc.ExitCode -ne 0) {
              Write-Host "::error::apply-update.ps1 exited $($applyProc.ExitCode)"
              Dump-ApplyUpdateLog
              Dump-ServerLog
              exit 1
          }

          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
              try {
                  $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health/ready" -TimeoutSec 2 -UseBasicParsing
                  if ($r.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
          }
          if (-not $ready) {
              Write-Host "::error::relaunched server never became ready after apply-update.ps1"
              Dump-ApplyUpdateLog
              Dump-ServerLog
              exit 1
          }

          $backupAppDir = Join-Path (Join-Path $updatesDir ("backup-{0}" -f $version)) 'app'
          if (-not (Test-Path -LiteralPath $backupAppDir)) {
              Write-Host "::error::$backupAppDir not found — apply-update.ps1 did not back up the pre-update app dir"
              Dump-ApplyUpdateLog
              exit 1
          }

          # Success is written by the RELAUNCHED server at boot, from the
          # intent marker (resolveIntentOnBoot — intent.to matches its own
          # version), not by the script itself — poll rather than assume it
          # landed the instant health/ready went green.
          $resultPath = Join-Path $updatesDir 'last-update-result.json'
          $resultOk = $false
          for ($i = 0; $i -lt 30; $i++) {
              if (Test-Path -LiteralPath $resultPath) {
                  try {
                      $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
                      if ($result.status -eq 'success') { $resultOk = $true; break }
                  } catch {}
              }
              Start-Sleep -Seconds 1
          }
          if (-not $resultOk) {
              Write-Host "::error::last-update-result.json missing or status != success within 30s"
              if (Test-Path -LiteralPath $resultPath) { Get-Content -LiteralPath $resultPath -Raw | Write-Host }
              Dump-ApplyUpdateLog
              Dump-ServerLog
              exit 1
          }

          $newPid = [int](Get-Content (Join-Path $dataDir '.grm.pid') | Select-Object -First 1)
          $stopProc = Start-Process -FilePath (Join-Path $extractDir 'GitHub Repo Manager.exe') -ArgumentList 'stop' -PassThru
          $stopProc.WaitForExit()
          if ($stopProc.ExitCode -ne 0) {
              Dump-ServerLog
              Write-Host "::error::update-smoke stop exited $($stopProc.ExitCode)"
              exit 1
          }
          if (Get-Process -Id $newPid -ErrorAction SilentlyContinue) {
              Write-Host "::error::relaunched server still running after update-smoke stop"
              exit 1
          }

          # Dump the timeline on SUCCESS too, not only on failure. This step
          # takes ~18 minutes and prints nothing until it is done, so there was
          # no way to tell which phase owns the time. apply-update.ps1 already
          # timestamps every checkpoint (waiting-for-exit, extracting, swapping,
          # relaunching), so the answer was being written to a file and thrown
          # away. It matters beyond CI: this is the same script a user's
          # self-update runs, and 18 minutes of a seemingly frozen app is a
          # product problem, not a pipeline one.
          Write-Host "---- apply-update timeline ----"
          Dump-ApplyUpdateLog

          Remove-Item -Recurse -Force -LiteralPath $extractDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force -LiteralPath $dataDir -ErrorAction SilentlyContinue
          Remove-Item -Force -LiteralPath $zipCopy -ErrorAction SilentlyContinue
          Write-Host "portable self-update dry-run smoke passed (same-version handoff: swap, relaunch, health, backup, last-update-result=success)"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          # package-windows.mjs is ESM; --input-type=module lets a bare `node
          # -e` import it directly instead of duplicating getPublisher()'s
          # "<person> - <company>" parsing here as a second source of truth.
          $publisher = node --input-type=module -e "import { getPublisher } from './scripts/package-windows.mjs'; console.log(getPublisher());"
          # choco's innosetup package installs machine-wide (the runner's user
          # is an admin) to Program Files (x86); ISCC.exe is not put on PATH.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
              $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$version" "/DMyAppPublisher=$publisher" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::ISCC exited with code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: Installer smoke test — silent install, boot, stop, silent uninstall
        run: |
          $ErrorActionPreference = 'Stop'
          $port = 18081
          $installDir = "$env:LOCALAPPDATA\Programs\GitHubRepoManager"
          $dataDir = "$env:LOCALAPPDATA\GitHubRepoManager\data"
          $correctDbFile = Join-Path $dataDir 'manager.db'
          # The wrong-location file a broken install-config.txt/marker read
          # would produce (the portable ".\data" default, resolved against
          # the install dir instead of LocalAppData). Asserting this is
          # ABSENT is what makes this test able to fail: launching the raw
          # .cmd (no --data-dir, no GRM_DATA_DIR) with the marker mechanism
          # reverted would put manager.db here instead of under LocalAppData.
          $wrongDbFile = Join-Path $installDir 'data\manager.db'

          $proc = Start-Process -FilePath '${{ steps.meta.outputs.setupPath }}' `
              -ArgumentList '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES' `
              -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
              Write-Host "::error::installer exited with code $($proc.ExitCode)"
              exit 1
          }
          if (-not (Test-Path (Join-Path $installDir 'Start GitHub Repo Manager.cmd'))) {
              Write-Host "::error::installed Start launcher not found at $installDir"
              exit 1
          }
          if (-not (Test-Path (Join-Path $installDir 'install-config.txt'))) {
              Write-Host "::error::install-config.txt marker not written by the installer at $installDir"
              exit 1
          }
          # The marker must carry the UNEXPANDED %LOCALAPPDATA% form so every
          # user resolves their own data dir (admin-driven rollouts): the
          # launchers expand it at run time. An absolute path here would pin
          # all users to the installing account's directory.
          $marker = Get-Content (Join-Path $installDir 'install-config.txt') -Raw
          if ($marker -notmatch [regex]::Escape('%LOCALAPPDATA%')) {
              Write-Host "::error::install-config.txt holds an expanded path instead of %LOCALAPPDATA%: $marker"
              exit 1
          }

          # Deliberately launch the RAW .cmd, not a Start Menu shortcut, and
          # deliberately do not set --data-dir/GRM_DATA_DIR: this is exactly
          # the path README-WINDOWS.txt tells users works, and the one the
          # original bug affected (only the shortcut's Parameters got this
          # right before the install-config.txt marker fix).
          $env:GRM_NO_BROWSER = '1'
          $env:GRM_PORT = "$port"
          Remove-Item Env:\GRM_DATA_DIR -ErrorAction SilentlyContinue
          & (Join-Path $installDir 'Start GitHub Repo Manager.cmd')

          $live = $false
          for ($i = 0; $i -lt 60; $i++) {
              try {
                  $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health/live" -TimeoutSec 2 -UseBasicParsing
                  if ($r.StatusCode -eq 200) { $live = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
          }
          if (-not $live) {
              Write-Host "::error::installed package never became live within 60s"
              exit 1
          }
          if (-not (Test-Path $correctDbFile)) {
              Write-Host "::error::no SQLite DB at $correctDbFile — the install-config.txt data-dir marker is not being read correctly"
              exit 1
          }
          if (Test-Path $wrongDbFile) {
              Write-Host "::error::SQLite DB found at $wrongDbFile — the raw .cmd launch fell back to the portable ./data default instead of the installed LocalAppData dir"
              exit 1
          }
          # v4.8.0 layout: .env lives in the data dir (it must survive
          # uninstall/reinstall — it holds the credential-vault key), and
          # nothing writable may be created under the install dir.
          if (-not (Test-Path (Join-Path $dataDir '.env'))) {
              Write-Host "::error::.env not found in the data dir — first-run wrote it to the wrong place"
              exit 1
          }
          if (Test-Path (Join-Path $installDir 'app\.env')) {
              Write-Host "::error::legacy app\.env exists under the install dir"
              exit 1
          }

          $pidFile = Join-Path $dataDir '.grm.pid'
          $serverPid = Get-Content -LiteralPath $pidFile
          & (Join-Path $installDir 'Stop GitHub Repo Manager.cmd')
          Start-Sleep -Seconds 2
          if (Get-Process -Id $serverPid -ErrorAction SilentlyContinue) {
              Write-Host "::error::server process $serverPid still running after installed Stop launcher"
              exit 1
          }

          $uninstaller = Get-ChildItem -LiteralPath $installDir -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) {
              Write-Host "::error::no uninstaller found in $installDir"
              exit 1
          }
          $uninstProc = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES' -PassThru -Wait
          if ($uninstProc.ExitCode -ne 0) {
              Write-Host "::error::uninstaller exited with code $($uninstProc.ExitCode)"
              exit 1
          }

          # Uninstaller self-deletes its own exe via a deferred OS rename/delete
          # trick — give the filesystem a moment before asserting the app dir
          # is gone, to avoid a flaky false failure.
          $appDirGone = $false
          for ($i = 0; $i -lt 10; $i++) {
              if (-not (Test-Path $installDir)) { $appDirGone = $true; break }
              Start-Sleep -Seconds 1
          }
          if (-not $appDirGone) {
              Write-Host "::error::app dir still present after uninstall: $installDir"
              Get-ChildItem -LiteralPath $installDir -Recurse -ErrorAction SilentlyContinue
              exit 1
          }
          if (-not (Test-Path $correctDbFile)) {
              Write-Host "::error::the SQLite DB itself was deleted by uninstall — should have been left in place: $correctDbFile"
              exit 1
          }
          if (-not (Test-Path (Join-Path $dataDir '.env'))) {
              Write-Host "::error::.env was deleted by uninstall — it must survive (holds the credential-vault encryption key)"
              exit 1
          }
          Write-Host "installer smoke test passed (install, boot, stop, uninstall — app dir gone, DB + .env preserved at the correct LocalAppData path, nothing written under the install dir)"

      # v7 to match every other workflow (ci.yml). Nothing consumes this
      # artifact via download-artifact, so the v4->v7 immutable-artifact
      # behaviour change has no downstream effect here.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-package-${{ steps.meta.outputs.version }}
          path: |
            .dev/package-windows/out/*.zip
            .dev/package-windows/out/*.sha256
            .dev/package-windows/out/*setup.exe
          retention-days: 7
