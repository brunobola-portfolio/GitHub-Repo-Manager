name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run on the same ref when a new push lands. Without
# this, fast successive pushes (typical during a review back-and-forth) double
# our CI minutes on commits that are already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run lint
      # Repo-wide sweep of the three guards that were previously wired ONLY
      # into lint-staged (debug statements, static __mocks__ imports, raw
      # z-index). A pre-commit hook is advisory: `--no-verify`, a clone where
      # husky never installed, and edits made through the GitHub web UI all
      # bypass it permanently. This re-checks every tracked file.
      - run: npm run guards
      # Relative links across the 215 markdown files under docs/. The script
      # existed but ran in no workflow and no test, so it had been red for an
      # unknown number of commits — a shipped report linked into the gitignored
      # .dev/ workspace, which nobody could follow from a clean clone.
      - run: npm run docs:linkcheck

  test:
    runs-on: ubuntu-latest
    env:
      # server/config.js loadConfig() requires SESSION_SECRET ≥16 chars. Test
      # code transitively imports this via require-tier.js; without a value
      # loadConfig throws and every test that touches require-tier fails.
      # This is a synthetic test value, not a real secret.
      SESSION_SECRET: ci-test-session-secret-not-real-32chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      # --coverage is what makes vitest.config.js's `thresholds` block execute.
      # Without it the floors were inert: the config was parsed, the numbers
      # were never compared against anything, and coverage could fall to zero
      # without failing a build.
      - run: npx vitest run --coverage
      # coverage.reportOnFailure is enabled in vitest.config.js, so this
      # uploads a usable report even when the run above went red — which is
      # the run you actually need it for.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      # Golden AI evals (mock-provider, deterministic, no API key). Real-model
      # evals (`--real`) are intentionally NOT run here — they need a provider
      # key + budget; run them locally/scheduled via `npm run test:evals:real`.
      - run: npm run test:evals

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run build
      # Build-gated honesty checks: no mock/demo data leaked into the production
      # bundle (build-honesty) and the eager bundle stays within budget
      # (bundle-budget). Both scan dist/, so they must run AFTER the build, and
      # they self-skip unless RUN_BUILD_TESTS=1 — which nothing set before, so
      # they silently skipped on every CI run until now.
      - name: Build-gated honesty checks
        run: RUN_BUILD_TESTS=1 npx vitest run tests/build/build-honesty.test.js tests/build/bundle-budget.test.js

  e2e:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-test-session-secret-not-real-32chars
      NODE_ENV: test
      VITE_MOCK_MODE: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: pw
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        # Browsers are cached; system deps (libnss, libgbm, …) still need
        # apt installation each run because they live on the runner image.
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
