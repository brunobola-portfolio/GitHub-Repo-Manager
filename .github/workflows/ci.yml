name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run on the same ref when a new push lands. Without
# this, fast successive pushes (typical during a review back-and-forth) double
# our CI minutes on commits that are already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    env:
      # server/config.js loadConfig() requires SESSION_SECRET ≥16 chars. Test
      # code transitively imports this via require-tier.js; without a value
      # loadConfig throws and every test that touches require-tier fails.
      # This is a synthetic test value, not a real secret.
      SESSION_SECRET: ci-test-session-secret-not-real-32chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npx vitest run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run build

  e2e:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-test-session-secret-not-real-32chars
      NODE_ENV: test
      VITE_MOCK_MODE: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: pw
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        # Browsers are cached; system deps (libnss, libgbm, …) still need
        # apt installation each run because they live on the runner image.
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
