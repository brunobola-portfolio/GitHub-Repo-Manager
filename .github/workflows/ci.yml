name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run on the same ref when a new push lands. Without
# this, fast successive pushes (typical during a review back-and-forth) double
# our CI minutes on commits that are already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run lint
      # Repo-wide sweep of the three guards that were previously wired ONLY
      # into lint-staged (debug statements, static __mocks__ imports, raw
      # z-index). A pre-commit hook is advisory: `--no-verify`, a clone where
      # husky never installed, and edits made through the GitHub web UI all
      # bypass it permanently. This re-checks every tracked file.
      - run: npm run guards
      # Relative links across the 215 markdown files under docs/. The script
      # existed but ran in no workflow and no test, so it had been red for an
      # unknown number of commits — a shipped report linked into the gitignored
      # .dev/ workspace, which nobody could follow from a clean clone.
      - run: npm run docs:linkcheck

  # The 6769-test suite took 318 s on one runner and was the critical path for
  # every PR that does not touch packaging/. Split across three runners it is
  # ~110 s each, and they start simultaneously.
  #
  # Coverage CANNOT be evaluated per shard — each shard only executes a third
  # of the tests, so its numbers would fall far below the floors and every
  # shard would fail. Shards therefore emit a blob report and evaluate nothing;
  # `test` below merges the three and applies the thresholds exactly once, over
  # the whole suite. That keeps the gate identical in strength to the single
  # run it replaces, which matters here: this repo has already shipped a
  # coverage config whose floors were silently inert.
  test-shard:
    name: test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # server/config.js loadConfig() requires SESSION_SECRET ≥16 chars. Test
      # code transitively imports this via require-tier.js; without a value
      # loadConfig throws and every test that touches require-tier fails.
      # This is a synthetic test value, not a real secret.
      SESSION_SECRET: ci-test-session-secret-not-real-32chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Run shard ${{ matrix.shard }} of 3
        # VITEST_SHARD_RUN switches off the coverage floors for this process
        # only — see the thresholds comment in vitest.config.js. Coverage is
        # still COLLECTED, because the blob has to carry it to the merge job.
        env:
          VITEST_SHARD_RUN: '1'
        run: npx vitest run --shard=${{ matrix.shard }}/3 --reporter=blob --coverage
      # Blob carries this shard's results AND its raw coverage, so the merge
      # job below can reconstruct both without re-running anything.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest-reports/
          retention-days: 1
          include-hidden-files: true

  test:
    # Named exactly `test` because that is the context branch protection
    # requires. Sharding briefly renamed this to "test (merge + coverage
    # floors)", which silently retired the gate: GitHub matches protection on
    # the check-run display name, so the required `test` context stopped
    # reporting and every PR became permanently BLOCKED with no failing check
    # to point at. The shards carry the descriptive names instead.
    name: test
    runs-on: ubuntu-latest
    needs: test-shard
    # `always()` so a red shard still produces the merged report and the
    # coverage artifact — that is precisely the run you need it for, which is
    # why vitest.config.js sets coverage.reportOnFailure.
    if: always()
    env:
      SESSION_SECRET: ci-test-session-secret-not-real-32chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v7
        with:
          path: .vitest-reports
          pattern: blob-report-*
          merge-multiple: true
      # --mergeReports runs no tests; it replays the three blobs as one suite,
      # so a failure in any shard fails here too and the thresholds see the
      # union of all three coverage maps.
      - name: Merge shards, report, and enforce coverage floors
        run: npx vitest run --mergeReports --coverage
      # Replaying blobs only catches shards that RAN and failed. A shard that
      # died before uploading — lost runner, npm ci failure — leaves its blob
      # missing, and with `if: always()` the merge would happily green-light
      # two thirds of the suite. Mirrors the e2e guard below.
      - name: Fail if any shard failed
        if: ${{ contains(needs.test-shard.result, 'failure') || contains(needs.test-shard.result, 'cancelled') }}
        run: |
          echo "::error::At least one test shard failed — see the merged coverage artifact"
          exit 1
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      # Golden AI evals (mock-provider, deterministic, no API key). Real-model
      # evals (`--real`) are intentionally NOT run here — they need a provider
      # key + budget; run them locally/scheduled via `npm run test:evals:real`.
      - run: npm run test:evals

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run build
      # Build-gated honesty checks: no mock/demo data leaked into the production
      # bundle (build-honesty) and the eager bundle stays within budget
      # (bundle-budget). Both scan dist/, so they must run AFTER the build, and
      # they self-skip unless RUN_BUILD_TESTS=1 — which nothing set before, so
      # they silently skipped on every CI run until now.
      - name: Build-gated honesty checks
        run: RUN_BUILD_TESTS=1 npx vitest run tests/build/build-honesty.test.js tests/build/bundle-budget.test.js

  # 272 s on one runner with workers:2. The worker count is deliberately low —
  # four workers on a single runner starved the dev server and made the suite
  # flaky (see playwright.config.js) — so the way to go faster is more runners,
  # not more workers per runner. Each shard boots its own dev server, so they
  # do not contend.
  e2e-shard:
    name: e2e (shard ${{ matrix.shard }}/3)
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SESSION_SECRET: ci-test-session-secret-not-real-32chars
      NODE_ENV: test
      VITE_MOCK_MODE: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: pw
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        # Browsers are cached; system deps (libnss, libgbm, …) still need
        # apt installation each run because they live on the runner image.
        run: npx playwright install-deps chromium
      - name: Run shard ${{ matrix.shard }} of 3
        run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # One HTML report for the whole suite instead of three partial ones. This is
  # also the job branch protection requires: it is red whenever any shard is,
  # and it is a single stable name rather than a matrix of three. Keep the
  # display name exactly `e2e` — see the note on the `test` job above.
  e2e:
    name: e2e
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v7
        with:
          path: all-blob-reports
          pattern: e2e-blob-*
          merge-multiple: true
      - name: Merge shard reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # merge-reports exits 0 even when the merged run contains failures — it
      # is a report builder, not a gate. Fail explicitly on any red shard, or
      # this job would go green over a broken suite.
      - name: Fail if any shard failed
        if: ${{ contains(needs.e2e-shard.result, 'failure') || contains(needs.e2e-shard.result, 'cancelled') }}
        run: |
          echo "::error::At least one e2e shard failed — see the merged report artifact"
          exit 1
