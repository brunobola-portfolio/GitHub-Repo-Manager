# Compose file for self-hosted production deployments.
#
# Enforced secrets (compose aborts with "variable not set" if any are missing):
#   SESSION_SECRET, WEBHOOK_SECRET, CREDENTIAL_ENCRYPTION_KEY, API_KEY_SECRET,
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, EMAIL_PROVIDER, EMAIL_FROM
#
# We use the `${VAR:?message}` form so a missing variable fails at `docker
# compose up` time with an explicit error, rather than silently booting with
# dev defaults that the startup-secrets-check would then reject seconds later
# with a less friendly message.
#
# Optional vars (Stripe billing, Sentry, Azure DevOps OAuth) fall back to ""
# via `${VAR:-}` so you can ignore them until you actually need them.

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - "NODE_ENV=production"
      # --- Core secrets — REQUIRED (compose aborts at `up` time if unset) ---
      - "SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set to a 32-plus-byte random value}"
      - "WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set for GitHub webhook signature verification}"
      - "CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set for user credential encryption}"
      - "API_KEY_SECRET=${API_KEY_SECRET:?API_KEY_SECRET must be set to sign issued API keys}"
      # --- GitHub OAuth — REQUIRED for login ---
      - "GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID must be set}"
      - "GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET must be set}"
      # --- Email delivery — REQUIRED in prod for license key + retention emails ---
      - "EMAIL_PROVIDER=${EMAIL_PROVIDER:?EMAIL_PROVIDER must be set to resend (console silently drops mail)}"
      - "EMAIL_FROM=${EMAIL_FROM:?EMAIL_FROM must be set}"
      - "RESEND_API_KEY=${RESEND_API_KEY:-}"
      # --- Frontend URL — required for CORS + cookies ---
      - "FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL must be set to the public HTTPS URL of the app}"
      # --- AI providers ---
      # Server-side fallback keys. Users bringing their own key (BYOK) never
      # touch these; they exist so an operator can offer AI without every user
      # configuring a provider. Forward all of them or AI_PROVIDER silently
      # resolves to a provider whose key never arrived.
      - "AI_PROVIDER=${AI_PROVIDER:-}"
      - "GEMINI_API_KEY=${GEMINI_API_KEY:-}"
      - "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}"
      - "OPENAI_API_KEY=${OPENAI_API_KEY:-}"
      - "OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}"
      - "LOCAL_MODEL=${LOCAL_MODEL:-}"
      - "LOCAL_API_KEY=${LOCAL_API_KEY:-}"
      - "LOCAL_BASE_URL=${LOCAL_BASE_URL:-}"
      - "ALLOW_LOCAL_AI_ENDPOINTS=${ALLOW_LOCAL_AI_ENDPOINTS:-}"
      # Per-provider model overrides; unset falls back to the curated defaults.
      - "GEMINI_MODEL=${GEMINI_MODEL:-}"
      - "GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-}"
      - "ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}"
      - "OPENAI_MODEL=${OPENAI_MODEL:-}"
      - "OPENROUTER_MODEL=${OPENROUTER_MODEL:-}"
      - "AI_RETRY_BASE_DELAY_MS=${AI_RETRY_BASE_DELAY_MS:-}"
      - "DISABLE_AI_REVIEW=${DISABLE_AI_REVIEW:-}"
      # Multi-tenant safety switch: with this unset, the server-side key above
      # is billed for every tenant that hasn't configured their own.
      - "AI_REQUIRE_USER_CONFIG=${AI_REQUIRE_USER_CONFIG:-}"
      # Denial-of-wallet ceiling on the server-side key, in cents per user per
      # month. 0/unset disables the cap entirely (see server/lib/ai-spend-cap.js).
      - "AI_SPEND_CAP_CENTS=${AI_SPEND_CAP_CENTS:-}"
      - "AI_SPEND_CAP_CENTS_FREE=${AI_SPEND_CAP_CENTS_FREE:-}"
      - "AI_SPEND_CAP_CENTS_PRO=${AI_SPEND_CAP_CENTS_PRO:-}"
      - "AI_SPEND_CAP_CENTS_ENTERPRISE=${AI_SPEND_CAP_CENTS_ENTERPRISE:-}"
      - "AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-}"
      # Conversational Repo Advisor. Off unless explicitly enabled.
      - "WORK_BOARD_AI_ENABLED=${WORK_BOARD_AI_ENABLED:-}"
      # --- Optional integrations ---
      - "SENTRY_DSN=${SENTRY_DSN:-}"
      - "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}"
      - "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}"
      # Price IDs. Missing here means checkout 400s AFTER the customer has
      # decided to buy — the failure is invisible until someone tries to pay.
      - "STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY:-}"
      - "STRIPE_PRICE_PRO_YEARLY=${STRIPE_PRICE_PRO_YEARLY:-}"
      - "STRIPE_PRICE_ENTERPRISE_MONTHLY=${STRIPE_PRICE_ENTERPRISE_MONTHLY:-}"
      - "STRIPE_PRICE_ENTERPRISE_YEARLY=${STRIPE_PRICE_ENTERPRISE_YEARLY:-}"
      - "LICENSE_SIGNING_PRIVATE_KEY_PEM=${LICENSE_SIGNING_PRIVATE_KEY_PEM:-}"
      # Second key during credential-encryption key rotation; decrypt-only.
      - "CREDENTIAL_ENCRYPTION_KEY_PREVIOUS=${CREDENTIAL_ENCRYPTION_KEY_PREVIOUS:-}"
      # Self-hosted activation key (server/config.js reads LICENSE_KEY; env
      # takes precedence over the DB-installed license — require-tier.js).
      # Without this, a paying self-host customer's LICENSE_KEY never
      # reaches the container and the deployment silently runs as Free.
      - "LICENSE_KEY=${LICENSE_KEY:-}"
      # Database backups (server/lib/db-backup.js). Points at the separate
      # app-backups volume below (NOT app-data) so a corrupted/lost live
      # volume doesn't take the backups down with it — see
      # docs/operations.md → "Backup & restore".
      - "DB_BACKUP_DIR=${DB_BACKUP_DIR:-/app/server/data-backups}"
      - "DB_BACKUP_KEEP=${DB_BACKUP_KEEP:-}"
      # --- Azure DevOps (migration importer) ---
      - "AZURE_PAT=${AZURE_PAT:-}"
      - "AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}"
      - "AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}"
      - "AZURE_TENANT_ID=${AZURE_TENANT_ID:-}"
      # Extra Azure DevOps Server (on-prem) hostnames, comma-separated.
      # Leave unset for Azure DevOps Cloud only.
      - "ALLOWED_AZURE_HOSTS=${ALLOWED_AZURE_HOSTS:-}"
      - "ALLOW_CONSOLE_EMAIL=${ALLOW_CONSOLE_EMAIL:-}"
      # --- Retention, observability, operational knobs ---
      - "DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-}"
      - "DATA_RETENTION_WARNING_LEAD_DAYS=${DATA_RETENTION_WARNING_LEAD_DAYS:-}"
      - "EVENT_RETENTION_DAYS=${EVENT_RETENTION_DAYS:-}"
      - "GH_CACHE_MAX_AGE_DAYS=${GH_CACHE_MAX_AGE_DAYS:-}"
      - "WORK_BOARD_SNAPSHOT_RETENTION_DAYS=${WORK_BOARD_SNAPSHOT_RETENTION_DAYS:-}"
      - "LOG_LEVEL=${LOG_LEVEL:-}"
      - "METRICS_TOKEN=${METRICS_TOKEN:-}"
      - "BULK_DESTRUCTIVE_DAILY_MAX=${BULK_DESTRUCTIVE_DAILY_MAX:-}"
      # Escape hatch for deployments terminating TLS somewhere this app can't
      # see. Leaving it unset is the safe default.
      - "DISABLE_HTTPS_ENFORCEMENT=${DISABLE_HTTPS_ENFORCEMENT:-}"
      - "REDIS_URL=redis://redis:6379"
    volumes:
      - app-data:/app/server/data
      - app-backups:/app/server/data-backups
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  app-data:
  app-backups:
  redis-data:
