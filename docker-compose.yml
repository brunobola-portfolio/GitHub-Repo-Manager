# Compose file for self-hosted production deployments.
#
# Enforced secrets (compose aborts with "variable not set" if any are missing):
#   SESSION_SECRET, WEBHOOK_SECRET, CREDENTIAL_ENCRYPTION_KEY, API_KEY_SECRET,
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, EMAIL_PROVIDER, EMAIL_FROM
#
# We use the `${VAR:?message}` form so a missing variable fails at `docker
# compose up` time with an explicit error, rather than silently booting with
# dev defaults that the startup-secrets-check would then reject seconds later
# with a less friendly message.
#
# Optional vars (Stripe billing, Sentry, Azure DevOps OAuth) fall back to ""
# via `${VAR:-}` so you can ignore them until you actually need them.

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - "NODE_ENV=production"
      # --- Core secrets — REQUIRED (compose aborts at `up` time if unset) ---
      - "SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set to a 32-plus-byte random value}"
      - "WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set for GitHub webhook signature verification}"
      - "CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set for user credential encryption}"
      - "API_KEY_SECRET=${API_KEY_SECRET:?API_KEY_SECRET must be set to sign issued API keys}"
      # --- GitHub OAuth — REQUIRED for login ---
      - "GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID must be set}"
      - "GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET must be set}"
      # --- Email delivery — REQUIRED in prod for license key + retention emails ---
      - "EMAIL_PROVIDER=${EMAIL_PROVIDER:?EMAIL_PROVIDER must be set to resend (console silently drops mail)}"
      - "EMAIL_FROM=${EMAIL_FROM:?EMAIL_FROM must be set}"
      - "RESEND_API_KEY=${RESEND_API_KEY:-}"
      # --- Frontend URL — required for CORS + cookies ---
      - "FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL must be set to the public HTTPS URL of the app}"
      # --- Optional integrations ---
      - "GEMINI_API_KEY=${GEMINI_API_KEY:-}"
      - "SENTRY_DSN=${SENTRY_DSN:-}"
      - "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}"
      - "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}"
      - "LICENSE_SIGNING_PRIVATE_KEY_PEM=${LICENSE_SIGNING_PRIVATE_KEY_PEM:-}"
      # Self-hosted activation key (server/config.js reads LICENSE_KEY; env
      # takes precedence over the DB-installed license — require-tier.js).
      # Without this, a paying self-host customer's LICENSE_KEY never
      # reaches the container and the deployment silently runs as Free.
      - "LICENSE_KEY=${LICENSE_KEY:-}"
      # Database backups (server/lib/db-backup.js). Points at the separate
      # app-backups volume below (NOT app-data) so a corrupted/lost live
      # volume doesn't take the backups down with it — see
      # docs/operations.md → "Backup & restore".
      - "DB_BACKUP_DIR=${DB_BACKUP_DIR:-/app/server/data-backups}"
      - "DB_BACKUP_KEEP=${DB_BACKUP_KEEP:-}"
      # Extra Azure DevOps Server (on-prem) hostnames, comma-separated.
      # Leave unset for Azure DevOps Cloud only.
      - "ALLOWED_AZURE_HOSTS=${ALLOWED_AZURE_HOSTS:-}"
      - "REDIS_URL=redis://redis:6379"
    volumes:
      - app-data:/app/server/data
      - app-backups:/app/server/data-backups
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  app-data:
  app-backups:
  redis-data:
